name: Install Terraform
description: >-
  Installs the pinned Terraform from its own release archive rather than
  through hashicorp/setup-terraform, because the runner downloads every action
  a workflow references before it evaluates any step's condition. The verified
  archive comes back from the Actions cache, so a job does not depend on
  releases.hashicorp.com answering. So do the providers `terraform init`
  installs, through Terraform's plugin cache directory: the configurations pin
  exact versions, and a registry download of the AWS provider once took a job
  five of its fifteen minutes.
inputs:
  providers-scope:
    description: >-
      Names the provider cache this job shares, such as its cloud; jobs that
      install the same providers pass the same scope.
    default: ${{ github.job }}
runs:
  using: composite
  steps:
    - name: Restore the Terraform release archive
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/sockerless/terraform
        key: terraform-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/install-terraform/action.yml') }}
    - name: Restore the Terraform providers
      uses: actions/cache@v6.1.0
      with:
        path: ~/.cache/sockerless/terraform-plugins
        key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ inputs.providers-scope }}-${{ hashFiles('**/*.tf') }}
        restore-keys: |
          terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ inputs.providers-scope }}-
    - name: Use the Terraform plugin cache
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.cache/sockerless/terraform-plugins"
        echo "TF_PLUGIN_CACHE_DIR=$HOME/.cache/sockerless/terraform-plugins" >> "$GITHUB_ENV"
        # The suites keep no lock file, so without this Terraform would verify
        # a cached provider against nothing and download it again.
        echo "TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE=true" >> "$GITHUB_ENV"
    - name: Install Terraform
      shell: bash
      env:
        TERRAFORM_VERSION: 1.16.0
      run: |
        set -euo pipefail
        dir="$HOME/.cache/sockerless/terraform"
        mkdir -p "$dir"
        archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
        sums="terraform_${TERRAFORM_VERSION}_SHA256SUMS"
        base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
        for file in "$archive" "$sums"; do
          if [ -s "$dir/$file" ]; then
            continue
          fi
          curl -fsSL --speed-limit 1024 --speed-time 30 --retry 8 --retry-all-errors \
            -o "$RUNNER_TEMP/$file.part" "$base/$file"
          mv "$RUNNER_TEMP/$file.part" "$dir/$file"
        done
        (cd "$dir" && grep " $archive\$" "$sums" | sha256sum --check --strict -)
        unzip -q -o "$dir/$archive" -d /usr/local/bin terraform
        terraform version
