name: CI

on:
  pull_request:
    branches: [main]
    # A release-please pull request rewrites only these two files, and it runs
    # no CI: the commits it releases were verified on their own pull requests
    # and on main. Ignoring the paths means GitHub creates no run at all, so
    # there is nothing for the outside-contributor approval gate to hold until
    # it expires as a failure. release-please is the only writer of both files,
    # so no other pull request consists of them alone.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
  push:
    branches: [main]
  # Reusable so tag pushes can get full PR-level CI.
  workflow_call:

# Pull-request runs are keyed by head ref: a new push to a branch makes the
# run under way obsolete, and only the latest commit's verdict is wanted, so
# cancelling reclaims runners with nothing lost. Everything else is keyed by
# commit: grouping main pushes together would let each merge cancel its
# predecessor's CI and leave a commit in main's history with no verdict. A
# per-commit group has one member and is never superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # verified-on-pr: a push to main whose tree already passed CI on its pull
  # request records that run as its verdict instead of running every job again
  # (scripts/ci-verified-on-pr.sh). Every other job needs it; `!cancelled()`
  # keeps a failure of this job from skipping the suite.
  verified-on-pr:
    name: Verified on its pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-verified-on-pr.sh

  lint-go:
    needs: verified-on-pr
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    name: lint (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The lint step keeps its own limit; the job's leaves room for the setup
    # before it and the cache save after it, which a missed build cache slows.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: simulators
            modules: simulator-aws simulator-gcp simulator-azure
            timeout_minutes: 10
          - shard: support
            modules: sim testutil ui-auth
            timeout_minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
      # install-go's own cache restores only an exact go.sum match, so a pin or
      # dependency move would lint the simulators cold. This one falls back to
      # the newest older entry and keeps golangci-lint's own analysis cache
      # beside the build cache.
      - uses: ./.github/actions/install-go
      - name: Restore the Go module, build and lint caches for this shard
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: lint-go-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', '**/go.sum', '.golangci.yml') }}
          restore-keys: |
            lint-go-${{ matrix.shard }}-${{ runner.os }}-${{ runner.arch }}-
            sim-go-${{ runner.os }}-${{ runner.arch }}-aws-
      - name: Install golangci-lint
        # Built from source through the Go module proxy rather than fetched
        # from the GitHub releases CDN: the install script's own downloader
        # has no retry knobs, and the warm Go build cache makes the build fast.
        run: |
          GOBIN="$(go env GOPATH)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" --version
      - name: Lint
        run: |
          set -e
          for module in ${{ matrix.modules }}; do
            echo "=== $module ==="
            make "$module/lint"
          done
        timeout-minutes: ${{ matrix.timeout_minutes }}

  check-deps:
    needs: verified-on-pr
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    name: check-deps (deps + actions + scripts)
    runs-on: ubuntu-latest
    # Every step here queries a live upstream — the GitHub API for two clouds'
    # specifications and Google's Discovery endpoints for the third, each
    # sampled several times — so the job's duration tracks those services
    # rather than anything in this repository; 15 is the project's maximum.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-go
        with:
          cache: 'true'
      - name: Install script check tools
        run: bash scripts/ci-apt-install.sh jq shellcheck zsh
      - name: Check shell scripts
        run: |
          shellcheck -x -s bash scripts/*.sh
          bash -n scripts/*.sh
          zsh -n scripts/*.sh
      # A dependency must have been public for at least a day before this
      # project adopts it, so the check holds versions younger than that instead
      # of reporting them as drift. The adoption quarantine is exercised in both
      # directions, with its negative controls, before the check itself runs —
      # a held version that should have been drift is the one way this gate
      # could go quiet without anyone noticing. The test serves the registries'
      # documents from fixtures, so it needs no GitHub token.
      - name: Adoption quarantine is exercised, negative controls included
        run: bash scripts/test-latest-deps-quarantine.sh
      # Attribution is the one change that can make this gate quieter, so it is
      # the one change that could make it stop gating. The controls prove a pin
      # the branch moved, and a pin the branch added, still fail with a baseline
      # in hand — run before the check itself, as the quarantine's are.
      - name: Dependency drift attribution is exercised, negative controls included
        run: bash scripts/test-latest-deps-baseline.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Both freshness checks below attribute drift against main, so main's tip
      # has to be a resolvable ref. The checkout is shallow; fetch just the one
      # commit the attribution reads.
      - name: Fetch main for drift attribution
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # --baseline origin/main holds this branch to the dependencies it pinned:
      # the adoption quarantine guarantees a steady drip of new drift, a version
      # becoming drift exactly 86400s after publication whether or not anybody
      # pushed. Inherited rows are reported and annotated here; the scheduled
      # Dependency freshness workflow runs with no baseline and is what fails on
      # them.
      - name: Check dependency freshness (bash)
        run: bash scripts/check-latest-deps.sh --baseline origin/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check dependency freshness (zsh)
        run: zsh scripts/check-latest-deps.sh --baseline origin/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Drift attribution is exercised, negative controls included
        run: bash scripts/test-spec-freshness-baseline.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The rows the refresh acts on decide whether a drift the freshness run
      # reported is ever vendored. Its own re-check is a second sample, so
      # the captured rows have to carry too; this holds that, negative
      # control included.
      - name: The refresh acts on the rows the run reported
        run: bash scripts/test-refresh-drifted-specs.sh
      # Every cloud's vendored specifications are gated, not just one: the
      # check takes a cloud argument, and each cloud is its own step so a
      # drift names the cloud that drifted. Each captures the newer document
      # it sampled so the refresh does not depend on the authoring machine's
      # edge serving the same revision the runner saw.
      #
      # --baseline origin/main holds this branch to the rows it touched. A row
      # whose pin the branch left as main recorded it drifted because upstream
      # moved, not because the branch let it rot; those rows are reported as
      # INHERITED and failed by the scheduled Specification freshness workflow,
      # which runs against main with no baseline. A row the branch changed,
      # rolled back, or added is still held to upstream tip right here.
      - name: Check Amazon Web Services API specification freshness
        id: aws-spec-freshness
        # The AWS and Azure specifications live in GitHub repositories, so this
        # check resolves their upstream tip through the GitHub API.
        # Unauthenticated requests are rate limited and the script treats a
        # throttled reply as "cannot query upstream" — correctly refusing to
        # pass a gate it could not evaluate — so the token is passed explicitly.
        # Google Cloud's Discovery documents are fetched from Google's own
        # endpoints and need no token.
        run: bash scripts/check-spec-freshness.sh --baseline origin/main aws
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_FRESHNESS_CAPTURE_DIR: ${{ runner.temp }}/aws-spec-drift
      # Inherited drift does not fail the step, so the capture is uploaded
      # whenever one was taken: the artifact is what the follow-up refresh
      # vendors, and only the run that sampled the newer document can
      # produce it.
      - name: Preserve drifted Amazon Web Services API specifications
        if: ${{ !cancelled() && steps.aws-spec-freshness.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aws-smithy-drift
          path: ${{ runner.temp }}/aws-spec-drift
          if-no-files-found: ignore
          retention-days: 1
      - name: Check Microsoft Azure API specification freshness
        id: azure-spec-freshness
        run: bash scripts/check-spec-freshness.sh --baseline origin/main azure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_FRESHNESS_CAPTURE_DIR: ${{ runner.temp }}/azure-spec-drift
      - name: Preserve drifted Microsoft Azure API specifications
        if: ${{ !cancelled() && steps.azure-spec-freshness.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: azure-spec-drift
          path: ${{ runner.temp }}/azure-spec-drift
          if-no-files-found: ignore
          retention-days: 1
      - name: Check Google Cloud API specification freshness
        id: gcp-spec-freshness
        run: bash scripts/check-spec-freshness.sh --baseline origin/main gcp
        env:
          SPEC_FRESHNESS_CAPTURE_DIR: ${{ runner.temp }}/gcp-spec-drift
      - name: Preserve drifted Google Cloud API specifications
        if: ${{ !cancelled() && steps.gcp-spec-freshness.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gcp-discovery-drift
          path: ${{ runner.temp }}/gcp-spec-drift
          if-no-files-found: ignore
          retention-days: 1

  single-open-pr:
    needs: verified-on-pr
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    name: At most one PR open
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: At most one PR open
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-single-open-pr.sh

  # pr-title: the squash-merge commit's title is the pull request title, and
  # release-please versions the repository by parsing main's history as
  # Conventional Commits — a title it cannot parse makes the merged work ship
  # in no release. The title arrives through env, never interpolated into the
  # script, so a crafted title cannot inject shell.
  pr-title:
    needs: verified-on-pr
    name: PR title is a Conventional Commit
    if: ${{ !cancelled() && (github.event_name == 'pull_request') && needs.verified-on-pr.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: PR title parses as a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-pr-title.sh "$PR_TITLE"

  # rebased-on-main: fail if the PR branch has fallen behind origin/main, so
  # every PR is tested (and merges) on top of the latest base.
  rebased-on-main:
    needs: verified-on-pr
    name: Branch rebased on origin/main
    if: ${{ !cancelled() && (github.event_name == 'pull_request') && needs.verified-on-pr.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Branch must be rebased on origin/main
        run: bash scripts/check-rebased-on-main.sh

  # A pull request restores only the caches its own runs saved and those main
  # saved. Main's verification jobs skip a tree its pull request already
  # passed, so this job saves, on main, the simulator Go cache the shards
  # restore; without it a new pull request's shards compile each cloud's
  # SDKs cold.
  warm-sim-go-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: warm Go cache (${{ matrix.cloud }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-go
      - name: Restore the Go module and build caches for this cloud's simulator jobs
        id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: sim-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cloud }}-${{ hashFiles('go.work', '**/go.sum') }}
          restore-keys: |
            sim-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cloud }}-
      - name: Build what the simulator jobs build
        if: steps.go-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}/sdk-tests
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}/cli-tests
          cd simulator-${{ matrix.cloud }}
          CGO_ENABLED=0 go build -o /dev/null .
          CGO_ENABLED=0 go test -c -o /dev/null .
          (cd sdk-tests && CGO_ENABLED=0 go test -c -o /dev/null .)
          (cd cli-tests && CGO_ENABLED=0 go test -c -o /dev/null .)
        timeout-minutes: 13
      - name: Save the Go module and build caches
        if: steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The base-image archive is the other cache main's skipped jobs never save.
  # The registries behind the base images throttle per project per minute, so
  # one job per cloud fetches the set a run lacks and the jobs that run
  # containers wait for it and restore the cache it saves, rather than each
  # fetching the same images at once inside its own time limit.
  warm-base-images:
    needs: verified-on-pr
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    name: warm base images (${{ matrix.cloud }}${{ matrix.base_images && ', one stack' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cloud: aws, module: simulator-aws}
          - {cloud: gcp, module: simulator-gcp}
          - {cloud: azure, module: simulator-azure}
          # The race and node agent jobs run the support module's containers.
          - {cloud: sim, module: sim}
          # The tf stack that names its own small set (Amazon RDS blue/green).
          - cloud: aws
            base_images: "mirror.gcr.io/library/mysql:8.0.46 mirror.gcr.io/library/alpine:3.22 mirror.gcr.io/library/busybox:latest"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Resolve the base images the simulator jobs run containers from
        id: base-images-list
        # Resolve the set and its digest exactly as the jobs that restore it
        # do, so the key this job saves is the key they look up.
        run: |
          images="${{ matrix.base_images }}"
          if [ -z "$images" ]; then
            images="$(bash scripts/base-images-for.sh ${{ matrix.module }} | tr '\n' ' ')"
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "digest=$({ printf '%s' "$images"; cat scripts/warm-base-images.sh; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the base images
        id: base-images
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/sockerless/base-images.tar
          key: base-images-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cloud }}-${{ steps.base-images-list.outputs.digest }}
          restore-keys: ${{ !matrix.base_images && format('base-images-{0}-{1}-{2}-', runner.os, runner.arch, matrix.cloud) || '' }}
      - name: Fetch the base images
        if: steps.base-images.outputs.cache-hit != 'true'
        run: |
          # shellcheck disable=SC2086
          bash scripts/warm-base-images.sh ~/.cache/sockerless/base-images.tar \
            ${{ steps.base-images-list.outputs.images }}
        timeout-minutes: 12
      - name: Save the base images
        if: steps.base-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/sockerless/base-images.tar
          key: ${{ steps.base-images.outputs.cache-primary-key }}

  sim:
    needs: [verified-on-pr, warm-base-images]
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every combination is listed rather than crossed, because one of them
        # is split in two and a cross product cannot express that.
        #
        # The SDK and CLI suites run as separate jobs so each gets its own
        # 15-minute ceiling: the Azure SDK suite's Cosmos DB emulator
        # differential tests alone approach the ceiling, leaving no room to run
        # the CLI suite in the same job.
        #
        # The Azure CLI suite is then split again, by first letter: unsharded
        # it ran near the fourteen-minute step allowance with its inner
        # deadline at thirteen minutes, the most it can be before a breach
        # stops producing a named Go stack. Its names partition cleanly on
        # `Test[A-M]` and `Test[N-Z]`.
        include:
          # The Google Cloud SDK suite is split by cost as well: unsharded its
          # job reached 781 seconds against the 15-minute bound, and the names
          # beginning with C — Cloud SQL, Cloud Run and the rest of the Cloud
          # family — are 183 seconds of its 359, every other letter 176.
          - cloud: gcp
            suite: sdk
            shard: C
            run: '^TestC'
            # Firewall rules between neighbours are enforced on guests; the
            # microvm shard proves it.
            skip: '^TestCompute_(FirewallRulesFilterWhatAnInstanceReceives|CloudNATCarriesAnInstancesConnections)'
          - cloud: gcp
            suite: sdk
            shard: not-C
            run: '^Test[^C]'
          - cloud: gcp
            suite: cli
          # The Azure SDK suite is split the same way, and for the same reason:
          # at 681 seconds of test time across 537 tests it reached a
          # fourteen-minute step allowance whose inner deadline is already at
          # thirteen minutes, and a run that overshoots is cancelled rather
          # than reported. The split is by cost rather than by count, because
          # the cost is not spread evenly over the alphabet: the names
          # beginning with A — the resource-move family and the PostgreSQL
          # flexible-server tests — are 346 seconds on their own, and every
          # other letter together is 335.
          - cloud: azure
            suite: sdk
            shard: A
            run: '^TestA'
          - cloud: azure
            suite: sdk
            shard: B-Z
            run: '^Test[B-Z]'
            # Network security groups between neighbours are enforced on
            # guests; the microvm shard proves it.
            skip: '^TestCosmos(Scripts)?_DifferentialVsEmulator|^TestCompute_(NetworkSecurityGroupFiltersWhatAMachineReceives|NatGatewayCarriesAMachinesConnections)'
          # Microsoft's Cosmos DB emulator needs most of a two-core runner for
          # minutes to initialise, so its two oracle tests run on their own.
          - cloud: azure
            suite: sdk
            shard: Cosmos
            run: '^TestCosmos(Scripts)?_DifferentialVsEmulator'
          # The microVM shards run each cloud's machine tests with that
          # service placed on Firecracker guests through the node agent, on
          # the runner's KVM: the instance's image, user data, metadata, DNS,
          # console, stop and start on its kept disk, and the disk's capture.
          # The regexes reach go test through make, which reads `$` as a
          # variable reference, so they anchor at the start only.
          - cloud: gcp
            suite: sdk
            shard: microvm
            run: '^TestCompute_(InstanceBootsRunsItsStartupScriptAndKeepsItsDisk|FirewallRulesFilterWhatAnInstanceReceives|CloudNATCarriesAnInstancesConnections)'
            placement: compute=microvm
            deadline: 9m
          # The Cloud Run microVM shard places each instance's containers in
          # one guest: the first as its process, the others as members from
          # their own images, sharing its localhost, started in dependsOn
          # order behind their startup probes.
          - cloud: gcp
            suite: sdk
            shard: run-microvm
            run: '^TestSDK_(CloudRunV2Services_(MultiContainerSharesLocalhost|DependsOnWaitsForTheSidecarsStartupProbe)|CloudRun_RunJob_DependsOnWaitsForStartupProbe)'
            placement: run=microvm
            deadline: 9m
          - cloud: azure
            suite: sdk
            shard: microvm
            run: '^TestCompute_(VirtualMachine(RunsCustomDataAndReadsItsMetadata|DeallocateKeepsTheOSDiskAndAnImageCapturesIt|StateOperations|GuestOperations|BootDiagnostics)|NetworkSecurityGroupFiltersWhatAMachineReceives|NatGatewayCarriesAMachinesConnections)'
            placement: virtualmachines=microvm
            deadline: 9m
          # The Container Apps microVM shard places each replica and job
          # execution in one guest, its sidecars as members, at an address
          # leased from the platform network.
          - cloud: azure
            suite: sdk
            shard: containerapps-microvm
            run: '^Test(SDK_ContainerAppsApps_(StartsRealReplicaAndLogs|MultiContainerSharesLocalhost|DaprSidecarServesRealDaprAPI)|ContainerApps_(MultiContainerJobSharesLocalhost|ExecutionRunsCommand|ExecutionLogsRealOutput|StartJobInjectsLogs))'
            placement: containerapps=microvm
            deadline: 9m
          # App Service on guests: the site's persistent /home, which Kudu
          # and the WebJobs share, reaches the guest as a file share the
          # simulator serves, so the site, its deployments, its WebJobs,
          # its container log and a slot's own instance run there, and a
          # site in a virtual network reaches a container group through
          # the network's private zone from its guest.
          - cloud: azure
            suite: sdk
            shard: web-microvm
            run: '^TestSDK_(WebApps_(FilesTheAppWritesPersist|KuduVFSCommandAndSettings|WebJobsRealRuns|ContainerLogs|SlotRunsItsOwnInstanceAndSwaps)|WebVnet_JoinsRealNetwork)'
            placement: web=microvm
            deadline: 9m
          - cloud: azure
            suite: cli
            shard: A-M
            run: '^Test[A-M]'
          - cloud: azure
            suite: cli
            shard: N-Z
            run: '^Test[N-Z]'
    name: sim (${{ matrix.cloud }} ${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    steps:
      - uses: actions/checkout@v7.0.1
      # Not install-go's cache: its key is shared by every job in the
      # workflow, whichever job misses first saves its own small module
      # and build cache, and every later job hits that entry and never
      # saves. The simulator jobs compile the cloud SDKs and their test
      # binaries — minutes of work that entry never held, paid cold by
      # every shard on every run, inside the timed test step. One entry
      # per cloud below holds what these shards actually build.
      - uses: ./.github/actions/install-go
      - name: Restore the Go module and build caches for this cloud's simulator jobs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Keyed on the dependency set, so it turns over when go.sum changes
          # and an older entry warms the incremental build until then.
          key: sim-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cloud }}-${{ hashFiles('go.work', '**/go.sum') }}
          restore-keys: |
            sim-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cloud }}-
      # These suites run real containers, and the registries they pull from
      # throttle anonymous pulls: the Amazon ECR Public Gallery, which serves the
      # images AWS publishes, caps them by data volume — a cap no retry
      # recovers from. Caching the images means the common case makes no
      # registry request at all, and the simulator's own puller asks the engine
      # before the registry, so a warmed image costs nothing even when a test
      # starts it repeatedly.
      - name: Resolve the base images this job runs containers from
        id: base-images-list
        run: |
          images="$(bash scripts/base-images-for.sh simulator-${{ matrix.cloud }} | tr '\n' ' ')"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "digest=$({ printf '%s' "$images"; cat scripts/warm-base-images.sh; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "$images"
      - name: Restore the base images
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/base-images.tar
          # One entry per cloud, keyed on the image set itself, so every job
          # that runs that cloud's containers shares it: the set is fetched
          # once for the whole workflow rather than once per job, which is
          # what a cap counted in bytes actually responds to. A changed set restores
          # the nearest earlier entry and fetches only the images it lacks.
          key: base-images-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cloud }}-${{ steps.base-images-list.outputs.digest }}
          restore-keys: |
            base-images-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cloud }}-
      - name: Load or fetch the base images
        # Priming a cache, not checking a dependency: if the registry refuses an
        # image here, the job carries on and whatever actually needs it fails at
        # the point of use, naming it.
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          bash scripts/warm-base-images.sh ~/.cache/sockerless/base-images.tar \
            ${{ steps.base-images-list.outputs.images }}
      - name: Start the network sidecar image build
        # The suites' first workload waits on the sidecar image, and a cold
        # build takes longer than a test gives it; the build runs while the job
        # does other work, and the wait step below blocks on it.
        run: bash scripts/ci-engine-image.sh sidecar-image start
        timeout-minutes: 3
      - name: Start the node agent image build
        # The simulator starts the agent before it listens, and the harness
        # gives it two minutes to listen; a cold build of the agent image
        # takes longer than that, so it builds while the job does other work.
        if: matrix.placement
        run: bash scripts/ci-engine-image.sh node-agent-image start
        timeout-minutes: 3
      # The Cloud Firestore emulator is a Java program, and the component
      # refuses anything below a Java 21 runtime, which the runner's default
      # `java` is not. The runner does ship newer runtimes alongside it, each
      # announced through a JAVA_HOME_<major>_<arch> variable, so the newest one
      # that satisfies the emulator goes on PATH ahead of the default.
      #
      # Deliberately not actions/setup-java: the runner downloads every action a
      # workflow references before it evaluates any step's condition, so a
      # gcp-only action step would cost every job in the matrix one more tarball
      # fetch from codeload, where fetches are throttled. A step that reads what
      # is installed costs nothing.
      - name: Put the Java runtime the Cloud Firestore emulator requires on PATH
        if: matrix.cloud == 'gcp'
        run: |
          best=""
          best_major=0
          while IFS='=' read -r name home; do
            case "$name" in JAVA_HOME_*) ;; *) continue ;; esac
            major=${name#JAVA_HOME_}
            major=${major%%_*}
            case "$major" in ''|*[!0-9]*) continue ;; esac
            [ -x "$home/bin/java" ] || continue
            [ "$major" -ge 21 ] || continue
            [ "$major" -gt "$best_major" ] || continue
            best_major=$major
            best=$home
          done <<<"$(env)"
          if [ -z "$best" ]; then
            echo "No Java 21+ runtime is installed on this runner; the Cloud Firestore emulator cannot start without one." >&2
            env | grep '^JAVA_HOME' >&2 || echo "(the runner announced no JAVA_HOME_* runtimes at all)" >&2
            exit 1
          fi
          echo "Using Java $best_major from $best"
          echo "$best/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$best" >> "$GITHUB_ENV"
      - name: Install gcloud CLI
        if: matrix.cloud == 'gcp'
        run: |
          archive="$RUNNER_TEMP/google-cloud-cli-linux-x86_64.tar.gz"
          curl --fail --location --show-error --silent --http1.1 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            --output "$archive" \
            https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz
          tar -xzf "$archive" -C "$HOME"
          echo "$HOME/google-cloud-sdk/bin" >> "$GITHUB_PATH"
          # The Firestore-emulator component is the differential-test oracle for
          # TestFirestore_DifferentialVsEmulator; the step above provides the
          # Java runtime it runs on. The alpha and beta tracks are the ones the
          # gcloud suite's commands name; installed here, no test installs them.
          "$HOME/google-cloud-sdk/bin/gcloud" components install cloud-firestore-emulator alpha beta --quiet
      # The runner image ships an Azure CLI that lags Microsoft's releases;
      # install the newest, as the AWS CLI and gcloud steps above do.
      - name: Install Azure CLI
        if: matrix.cloud == 'azure'
        run: |
          # The installer runs apt-get with apt's default network timeouts, which
          # let a stalled mirror hold the job; the timeouts ci-apt-install.sh
          # passes apt-get apply to it through apt.conf.d.
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80ci-timeouts > /dev/null
          for attempt in 1 2; do
            curl --fail --location --show-error --silent \
              --retry 5 --retry-all-errors --retry-delay 5 \
              --connect-timeout 20 --max-time 300 \
              -o /tmp/install-azure-cli.sh https://aka.ms/InstallAzureCLIDeb
            if sudo timeout 240 bash /tmp/install-azure-cli.sh; then
              break
            fi
            [ "$attempt" = 2 ] && exit 1
          done
          hash -r
          az version
      - name: Install Caddy
        # TestArtifactRegistryCLI_DockerLoginPushPull serves the Artifact
        # Registry Docker data plane over TLS through the repository's HTTPS
        # gateway, which is Caddy, because a container engine speaks TLS to a
        # registry.
        if: matrix.cloud == 'gcp' && matrix.suite == 'cli'
        run: |
          bash scripts/install-caddy.sh
      # Module download + test-binary compilation get their own budget so the
      # timed run below isn't eaten by a cold module cache after a dep change
      # busts the shared **/go.sum Go cache.
      - name: Pre-build module unit tests (warm build cache)
        if: matrix.suite == 'sdk'
        run: |
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}
          cd simulator-${{ matrix.cloud }}
          CGO_ENABLED=0 go test -count=1 -c -o /dev/null .
        timeout-minutes: 8
      - name: Wait for the network sidecar image
        run: bash scripts/ci-engine-image.sh sidecar-image wait
        timeout-minutes: 8
      - name: Run module unit tests
        # Shard-independent; the sdk suite carries them so they run once per
        # cloud. The inner deadline sits under the step budget so a hung test
        # fails with a named Go stack rather than an opaque step kill.
        if: matrix.suite == 'sdk' && !matrix.placement
        run: cd simulator-${{ matrix.cloud }} && make unit-test UNIT_TEST_TIMEOUT=2m30s
        timeout-minutes: 3
      # Pre-pull the Cosmos DB emulator (the differential-test oracle for
      # TestCosmos_DifferentialVsEmulator). The differential pulls the image
      # itself when it is absent; pre-pulling only keeps that download out of
      # the go-test deadline so the job budget stays predictable.
      - name: Pull Cosmos DB emulator (differential oracle)
        if: matrix.cloud == 'azure' && matrix.suite == 'sdk' && matrix.shard == 'Cosmos'
        run: docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        timeout-minutes: 8
      - name: Prepare the engine's trust directory and the low ports for the runner
        # The suites install a registry's authority under /etc/docker/certs.d
        # for the engine to trust it and receive mail on port 25, and the
        # runner, not root, runs them.
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /etc/docker/certs.d
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: The runner offers KVM to the node agent
        if: matrix.placement
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Wait for the node agent image
        if: matrix.placement
        run: bash scripts/ci-engine-image.sh node-agent-image wait
        timeout-minutes: 8
      - name: Run SDK tests
        if: matrix.suite == 'sdk'
        run: |
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}/sdk-tests
          cd simulator-${{ matrix.cloud }}
          env \
            SIM_PLACEMENT="${{ matrix.placement }}" \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/${{ matrix.cloud }}-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/${{ matrix.cloud }}" \
            make sdk-test ${{ matrix.deadline && format('SDK_TEST_TIMEOUT={0}', matrix.deadline) || '' }} ${{ matrix.run && format('SDK_TEST_ARGS="-run ''{0}''{1} ./..."', matrix.run, matrix.skip && format(' -skip ''{0}''', matrix.skip) || '') || '' }}
        # Headroom over the inner go-test deadline (SDK_TEST_TIMEOUT, 13m) so a
        # suite that overruns fails with a named Go stack rather than an opaque
        # step kill. A guest shard's setup also builds the node agent image,
        # so its deadline is the shorter one its matrix row names, inside what
        # the job's limit leaves it.
        timeout-minutes: 14
      - name: Simulator diagnostics
        # The simulator the suite started outlives a deadline panic; what it
        # was still serving says where a hung test waited.
        if: failure() && matrix.suite == 'sdk'
        run: bash scripts/dump-sim-diagnostics.sh
        timeout-minutes: 2
      - name: Pre-build the simulator and the CLI tests (warm build cache)
        if: matrix.suite == 'cli'
        run: |
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}/cli-tests
          cd simulator-${{ matrix.cloud }} && CGO_ENABLED=0 go build -o /dev/null .
          cd cli-tests && CGO_ENABLED=0 go test -c -o /dev/null .
        timeout-minutes: 10
      - name: Run CLI tests
        if: matrix.suite == 'cli'
        run: |
          cd simulator-${{ matrix.cloud }}
          env \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/${{ matrix.cloud }}-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/${{ matrix.cloud }}" \
            make cli-test ${{ matrix.run && format('CLI_TEST_ARGS="-run ''{0}'' ./..."', matrix.run) || '' }}
        timeout-minutes: 14
      # Each shard ratchets what its own run produced. The gate fails on any key
      # its report holds that the allowlist does not, so a partial report can
      # never pass a violation the other shard would have caught — the two
      # together cover every test, and each one still refuses to pass a report
      # the validator did not write at all.
      - name: Spec-shape ratchet
        run: bash scripts/check-spec-violations.sh ${{ matrix.cloud }} "$RUNNER_TEMP/${{ matrix.cloud }}-spec-violations.jsonl"

  sim-aws-sdk:
    needs: [verified-on-pr, warm-base-images]
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    # The AWS SDK suite outgrew a single 15-minute job (the full run reached
    # the ceiling on runner-speed variance), so it fans out across four shards
    # the way the AWS CLI suite does. Shard regexes use the character-class form
    # ('^Test[...]') rather than the CLI shards' alternation form
    # ('^Test(...)') so each suite's coverage gate reads only its own shard
    # set; scripts/check-sdk-shard-coverage.sh asserts every SDK test matches
    # exactly one shard.
    name: sim (aws sdk ${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Amazon ECS is split away from the rest of the E tests into the data
          # shard, whose own tests are short. The Amazon Aurora tests and the
          # Amazon RDS tests from A to I run in shards of their own: their
          # engines, cluster volumes, backups and restores do not fit beside the
          # N-Z tests in one job budget. A security group's enforcement between
          # neighbours and a NAT gateway's routing are the microVM backend's; the
          # guest shard proves them.
          - suite: compute
            run: '^Test(E[^C]|EC[^S])'
            skip: '^TestEC2_(SecurityGroupFiltersWhatAnInstanceReceives|NatGatewayCarriesAPrivateSubnetsConnections|RegionalNatGatewayCarriesEachZonesConnections)'
          # The Amazon Aurora tests run in a shard of their own: beside the EC2
          # real-execution tests they do not fit compute's job budget.
          - suite: rds-aurora
            run: '^Test(RDS_Aurora)'
          # The Amazon RDS tests from A to I run in a shard of their own: read
          # replicas that start their own engine do not fit the data shard's job
          # budget.
          - suite: data
            run: '^Test(D|ECS)'
          - suite: rds-a-i
            run: '^Test(RDS_(A[^u]|Au[^r]|[B-I]))'
          - suite: services-a-m
            run: '^Test[A-CF-M]'
          - suite: services-n-z
            run: '^Test([N-QS-Z]|R[^D]|RD[^S]|RDS[^_]|RDS_([^A-IM]|M[^ou]|Modify[^D]))'
          # The ModifyDBInstance tests restart engines on a new CA, a new port
          # and a renamed volume, which the services-n-z shard has no room for.
          - suite: rds-modify
            run: '^Test(RDS_ModifyDB)'
          # The Multi-AZ tests build a standby engine for each of three engine
          # families, fail over twice and build a new standby after each.
          - suite: rds-multi-az
            run: '^Test(RDS_MultiAZ)'
          # The instance tests again, with Amazon EC2 placed on Firecracker
          # guests through the node agent on the runner's KVM: the AMI's
          # image, user data, metadata, console, stop and start on the kept
          # root disk, CreateImage's capture of it, and Run Command.
          # A guest shard's setup also loads the base images and builds the
          # node agent image, six minutes of a fifteen-minute job, so its
          # Go deadline is shorter than the suite's: a shard that hangs then
          # still ends with named stacks and the simulator's own dump, where
          # the job's limit would have cancelled it with neither.
          - suite: ec2-microvm
            run: '^TestEC2(_(InstanceRunsUserDataAndReadsItsMetadata|StopKeepsTheRootDiskAndCreateImageCapturesIt|InstancesOfVPCsSharingACIDRCannotCoexist|RunInstancesRefusesAnArchitectureMismatch|ImportImageFromAnOCIReferenceBoots|ConsoleOutput|SecurityGroupFiltersWhatAnInstanceReceives|NatGatewayCarriesAPrivateSubnetsConnections|RegionalNatGatewayCarriesEachZonesConnections)|InstanceSurvivesSimulatorRestart_SDK)$'
            placement: ec2=microvm
            deadline: 420s
          # Amazon ECS Fargate tasks again, each awsvpc task in one guest at
          # its ENI's address with the other containers as members: the
          # shared localhost, the ENI attachment, overrides, secrets, the
          # exit codes and stop codes, a managed EBS volume served to the
          # guest from a share container, a service's tasks behind a load
          # balancer, and the service lifecycle.
          - suite: ecs-microvm
            run: '^TestECS_(MultiContainerTaskSharesLocalhost|RunTask_AwsvpcAttachesElasticNetworkInterface|StopCodeUserInitiated|ExitCodeNilWhileRunning|RunTaskContainerOverridesApplyToRuntimeSDK|TaskDefinitionSecretsInjected|RunTask_RunningDoesNotWaitForTheApplication|ManagedEBSVolumeIsTheTasksOwnSDK|TaskVolumeIsSharedByItsContainersAndItsOwn)$'
            placement: ecs:FARGATE=microvm
            deadline: 420s
          - suite: ecs-services-microvm
            run: '^TestECS_(ServiceRegistersHealthyLoadBalancerTargets|ServiceLifecycle)$'
            placement: ecs:FARGATE=microvm
            deadline: 420s
    steps:
      - uses: actions/checkout@v7.0.1
      # Not install-go's cache: its key is shared by every job in the
      # workflow, whichever job misses first saves its own small module
      # and build cache, and every later job hits that entry and never
      # saves. The simulator jobs compile the cloud SDKs and their test
      # binaries — minutes of work that entry never held, paid cold by
      # every shard on every run, inside the timed test step. One entry
      # per cloud below holds what these shards actually build.
      - uses: ./.github/actions/install-go
      - name: Restore the Go module and build caches for this cloud's simulator jobs
        id: go-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Keyed on the dependency set, so it turns over when go.sum changes
          # and an older entry warms the incremental build until then.
          key: sim-go-${{ runner.os }}-${{ runner.arch }}-aws-${{ hashFiles('go.work', '**/go.sum') }}
          restore-keys: |
            sim-go-${{ runner.os }}-${{ runner.arch }}-aws-
      # Download modules and compile the unit-test binaries in their own
      # budgeted step, so the timed test run below isn't eaten by a cold
      # module cache after a dep change busts the shared **/go.sum Go cache —
      # the same separation the SDK pre-build step below makes for the same
      # reason.
      - name: Pre-build AWS module unit tests (warm build cache)
        if: matrix.suite == 'services-a-m'
        run: |
          bash scripts/ci-go-mod-download.sh simulator-aws
          cd simulator-aws
          CGO_ENABLED=0 go test -count=1 -c -o /dev/null .
        timeout-minutes: 8
      - name: Run AWS module unit tests
        # The module unit tests are shard-independent; one shard carries them
        # so they run exactly once per workflow, and it is the shard with the
        # most room. The run step's budget holds the suite alone — compilation
        # happened above. The inner deadline sits under the step budget so a
        # hung test fails with a named Go stack rather than an opaque step kill.
        if: matrix.suite == 'services-a-m'
        run: cd simulator-aws && make unit-test UNIT_TEST_TIMEOUT=5m30s
        timeout-minutes: 6
      # Compile the sim binary + the (large, AWS-SDK-importing) SDK test binary
      # in a separate deterministic build step, so the timed test run below isn't
      # eaten by a cold recompile after an unrelated dep change busts the shared
      # **/go.sum Go cache. Build time gets its own budget; the test keeps a
      # tight one.
      - name: Pre-build AWS SDK tests (warm build cache)
        run: |
          bash scripts/ci-go-mod-download.sh simulator-aws
          cd simulator-aws && make build-api
          cd sdk-tests && CGO_ENABLED=0 go test -c -o /tmp/aws-sdk-tests.test .
        # This step exists to absorb a cold build, so its budget has to fit
        # one: measured at 3m16s against a warm cache and over six minutes
        # against an empty one. Six minutes was under twice the warm cost,
        # which is no margin for the case the step is for.
        timeout-minutes: 10
      # One shard saves the entry, once its pre-build has filled it: every
      # shard saving on a miss would each spend a minute or more compressing
      # the same caches inside its job budget. The data shard finishes with
      # the most budget to spare.
      - name: Save the Go module and build caches
        if: matrix.suite == 'data' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      # Free disk before the timed run — but never the Go caches. The cache
      # saves at post-job, and a branch's first run restores the default
      # branch's entry, which is not an exact hit in its own scope, so it
      # saves what it has: after deleting the caches that would be nothing,
      # poisoning the cache for every later job. The container images and apt
      # lists are the part worth reclaiming.
      - name: Free AWS SDK runner disk before execution
        run: |
          df -h
          go clean -testcache
          rm -rf "$RUNNER_TEMP/go-build"
          docker image prune -af
          sudo apt-get clean
          df -h
        timeout-minutes: 3
      # These suites run real containers — the DynamoDB Local differential
      # oracle, the alpine workload a Batch job runs, the database engines the
      # Amazon RDS data plane starts — and the registry caps anonymous requests
      # by data volume, which no retry recovers from. The warm sits after the
      # prune above because that step deletes every image on the host.
      - name: Resolve the base images this job runs containers from
        id: base-images-list
        run: |
          images="$(bash scripts/base-images-for.sh simulator-aws | tr '\n' ' ')"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "digest=$({ printf '%s' "$images"; cat scripts/warm-base-images.sh; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "$images"
      - name: Restore the base images
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/base-images.tar
          # One entry per cloud, keyed on the image set itself, so every job
          # that runs that cloud's containers shares it: the set is fetched
          # once for the whole workflow rather than once per job, which is
          # what a cap counted in bytes actually responds to. A changed set restores
          # the nearest earlier entry and fetches only the images it lacks.
          key: base-images-${{ runner.os }}-${{ runner.arch }}-aws-${{ steps.base-images-list.outputs.digest }}
          restore-keys: |
            base-images-${{ runner.os }}-${{ runner.arch }}-aws-
      - name: Load or fetch the base images
        # Priming a cache, not checking a dependency: if the registry refuses an
        # image here, the job carries on and whatever actually needs it fails at
        # the point of use, naming it.
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          bash scripts/warm-base-images.sh ~/.cache/sockerless/base-images.tar \
            ${{ steps.base-images-list.outputs.images }}
      - name: Start the network sidecar image build
        # The suites' first workload waits on the sidecar image, and a cold
        # build takes longer than a test gives it; the build runs while the job
        # does other work, and the wait step below blocks on it.
        run: bash scripts/ci-engine-image.sh sidecar-image start
        timeout-minutes: 3
      - name: Start the node agent image build
        # The simulator starts the agent before it listens, and the harness
        # gives it two minutes to listen; a cold build of the agent image
        # takes longer than that, so it builds while the job does other work.
        if: matrix.placement
        run: bash scripts/ci-engine-image.sh node-agent-image start
        timeout-minutes: 3
      - name: Prepare the engine's trust directory and the low ports for the runner
        # The suite installs a registry's authority under /etc/docker/certs.d
        # for the engine to trust it and receives mail on port 25, and the
        # runner, not root, runs it.
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /etc/docker/certs.d
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: The runner offers KVM to the node agent
        if: matrix.placement
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Wait for the node agent image
        if: matrix.placement
        run: bash scripts/ci-engine-image.sh node-agent-image wait
        timeout-minutes: 8
      - name: Wait for the network sidecar image
        run: bash scripts/ci-engine-image.sh sidecar-image wait
        timeout-minutes: 8
      - name: Run AWS SDK tests
        # Output goes to a file under a watched budget: a suite that fills the
        # runner volume kills the runner process mid-write, and the job log with
        # it. If the log or the volume crosses its threshold, the run stops and
        # reports the largest relevant consumers through bounded scans while
        # there is still disk to report them on.
        run: |
          set -o pipefail
          cd simulator-aws/sdk-tests
          log="$RUNNER_TEMP/aws-sdk-tests.out"
          report() {
            echo "=== volume ==="; df -h /
            echo "=== test output size ==="; du -h "$log" 2>/dev/null || true
            echo "=== docker ==="; docker system df 2>/dev/null || true
          }
          report_consumers() {
            echo "=== largest relevant consumers ==="
            for path in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
              if [ -e "$path" ]; then
                echo "--- $path ---"
                timeout 5s du -x -m -d 2 "$path" \
                  | sort -rn | sed -n '1,10p' \
                  || echo "::warning::Disk-consumer scan did not complete within 5 seconds: $path"
              fi
            done
          }
          env \
            SIM_PLACEMENT="${{ matrix.placement }}" \
            SOCKERLESS_AWS_SIMULATOR_BINARY="$GITHUB_WORKSPACE/simulator-aws/simulator-aws" \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/aws-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/aws" \
            /tmp/aws-sdk-tests.test -test.v -test.count=1 -test.timeout="${{ matrix.deadline || '600s' }}" -test.run "$SHARD_RUN" ${SHARD_SKIP:+-test.skip "$SHARD_SKIP"} > "$log" 2>&1 &
          test_pid=$!
          # The log streams into the job's output as it is written, so a job
          # the runner cancels at its limit still shows which test it was in.
          tail -n +1 -F "$log" &
          tail_pid=$!
          while kill -0 "$test_pid" 2>/dev/null; do
            log_mb=$(( $(stat -c %s "$log" 2>/dev/null || echo 0) / 1048576 ))
            free_mb=$(df -m --output=avail / | tail -1 | tr -d ' ')
            if [ "$log_mb" -gt 2048 ] || [ "$free_mb" -lt 8192 ]; then
              echo "::error::AWS SDK tests exceeded their disk budget (output ${log_mb} MB, ${free_mb} MB free)."
              echo "--- last 200 lines before the budget was hit ---"
              tail -n 200 "$log" || true
              report
              report_consumers
              kill -QUIT "$test_pid" 2>/dev/null || true
              sleep 10
              kill -9 "$test_pid" 2>/dev/null || true
              kill "$tail_pid" 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done
          # The step runs under `bash -e`; guard the wait with `|| status=$?`
          # so a failing test binary does not abort the step before the
          # failure summary names which test failed.
          status=0
          wait "$test_pid" || status=$?
          sleep 2
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          report
          if [ "$status" != 0 ]; then
            bash "$GITHUB_WORKSPACE/scripts/go-test-failure-summary.sh" "$log"
            # The simulator the suite started outlives a deadline panic; what
            # it was still serving says where a hung test waited.
            bash "$GITHUB_WORKSPACE/scripts/dump-sim-diagnostics.sh"
          fi
          exit "$status"
        # The suite grows as services reach full op-coverage; give the step
        # headroom over the inner go-test deadline (SDK_TEST_TIMEOUT) so a hung
        # test fails with a named Go stack rather than an opaque step kill.
        timeout-minutes: 12
        env:
          SHARD_RUN: ${{ matrix.run }}
          SHARD_SKIP: ${{ matrix.skip }}
      - name: Spec-shape ratchet (aws sdk ${{ matrix.suite }})
        run: bash scripts/check-spec-violations.sh aws "$RUNNER_TEMP/aws-spec-violations.jsonl"

  sim-aws-cli:
    needs: [verified-on-pr, warm-base-images]
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    name: sim (aws cli ${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: edge-routing
            run: '^Test(ACM|Amplify|APIGateway|ApplicationAutoScaling|AutoScaling|Batch|Budgets|PrivateCA)'
            timeout: 1200s
            timeout_minutes: 15
          # edge-delivery runs close to its 900s job: CloudFront and CloudTrail
          # keep the shard, and ELBv2, CodeBuild and Firehose take edge-build.
          - suite: edge-delivery
            run: '^Test(CloudFront|CloudTrail)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: edge-build
            run: '^Test(CodeBuild|ELBv2|Firehose)'
            timeout: 1200s
            timeout_minutes: 15
          # AWS Glue and IAM each take a shard: together their tests do not fit
          # the 15-minute ceiling after a slow base-image load.
          - suite: glue
            run: '^Test(Glue)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: iam
            run: '^Test(IAM|RDSCLI_OptionGroup)'
            timeout: 1200s
            timeout_minutes: 15
          # The EC2 shards and appdata2 split by measured cost, so each holds a
          # slow runner's margin under the job budget.
          - suite: ec2-a-h
            run: '^Test(EC2(CLI_[A-H]|Copy|EBS)|RDSCLI_DBInstance)'
            timeout: 1500s
            timeout_minutes: 15
          - suite: ec2-i-m
            run: '^Test(EC2(CLI_[I-M]|Instance|Key|Launch))'
            timeout: 1500s
            timeout_minutes: 15
          - suite: ec2-n-s
            run: '^Test(EC2(CLI_[N-S]|Nat|Network|Routing|Security|Subnet))'
            timeout: 1500s
            timeout_minutes: 15
          - suite: ec2-t-z
            run: '^Test(EC2CLI_[T-Z])'
            timeout: 1500s
            timeout_minutes: 15
          # compute is split in two by cost — CloudWatch Logs and Cloud Map
          # together, the other four services apart — so each half sits well
          # under the job budget with a slow runner's margin to spare.
          - suite: compute
            run: '^Test(CLI_ECR|DynamoDB|ECR|EFS)'
            timeout: 1200s
            timeout_minutes: 15
          # The Amazon RDS CLI tests spread over several shards: every DB
          # instance and Aurora cluster takes its first automated backup when
          # it is created, which the CLI's db-instance-available waiter
          # observes at its 30-second cadence, so the three costliest
          # (RestoreAndReserved, OptionGroupAndReplica, DBInstanceLifecycle)
          # run in the appdata5, iam and ec2-a-h shards.
          - suite: observability
            run: '^Test(CloudMap|Logs|RDSCLI_Instance)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: ecs
            run: '^Test(ECS)'
            timeout: 1200s
            timeout_minutes: 15
          # appdata is split in two: the CLI test binary's cold compile takes
          # about eight minutes, so a shard's suite must fit the remainder.
          - suite: appdata
            run: '^Test(CloudWatch|EventBridge|Kinesis|ResourceTags|RDSCLI_Aurora)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: appdata4
            run: '^Test(ElastiCache|KMS|Lambda|Organizations)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: appdata2
            run: '^Test(AWSServiceState|RDSCLI_([^ABIDMOR]|A[^u]|I[^n]|D[^B]|DB[^I]|R[^e]|Reb))'
            timeout: 1200s
            timeout_minutes: 15
          # A blue/green deployment starts the blue and green engines and
          # copies the blue volume twice, so its tests run apart.
          - suite: rds-blue-green
            run: '^Test(RDSCLI_BlueGreen)'
            timeout: 1200s
            timeout_minutes: 15
          # The RDS for MariaDB and MySQL engine-user tests each start their
          # own engines and take first automated backups, so they run apart
          # from the other Amazon RDS shards.
          - suite: rds-engines
            run: '^Test(RDSCLI_(MariaDB|MySQLIAM))'
            timeout: 1200s
            timeout_minutes: 15
          # A read replica starts its source's engine and its own, copies the
          # source volume and waits on the CLI's 30-second waiter cadence for
          # each of the create, the replica and the promotion, so the replica
          # and engine version upgrade tests run apart.
          - suite: rds-read-replica
            run: '^Test(RDSCLI_(ReadReplica|ReleasedEngineVersion|ReplicatedBackup))'
            timeout: 1200s
            timeout_minutes: 15
          # A Multi-AZ instance starts a primary and a standby engine, and its
          # failover waits on the CLI's 30-second waiter cadence.
          - suite: rds-multi-az
            run: '^Test(RDSCLI_MultiAZ)'
            timeout: 1200s
            timeout_minutes: 15
          # The DB parameter group, maintenance window and ModifyDBInstance
          # tests start, reboot and rename engines and wait for a maintenance
          # window that opens at the next minute, read at the CLI waiter's
          # 30-second cadence.
          - suite: rds-parameters
            run: '^Test(RDSCLI_(Maintenance|ModifiedDBParameterGroup|ModifyDBInstance))'
            timeout: 1200s
            timeout_minutes: 15
          - suite: appdata5
            run: '^Test(Route53|S3)'
            timeout: 1200s
            timeout_minutes: 15
          # appdata3 is split again: a passing run took 14.5 minutes of its
          # 15-minute job budget.
          - suite: appdata3
            run: '^Test(Scheduler|SecretsManager|SFN|SNS|RDSCLI_Restore)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: appdata6
            run: '^Test(SQS|SSM|STS|WAFv2)'
            timeout: 1200s
            timeout_minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      # Not install-go's cache: its key is shared by every job in the
      # workflow, whichever job misses first saves its own small module
      # and build cache, and every later job hits that entry and never
      # saves. The simulator jobs compile the cloud SDKs and their test
      # binaries — minutes of work that entry never held, paid cold by
      # every shard on every run, inside the timed test step. One entry
      # per cloud below holds what these shards actually build.
      - uses: ./.github/actions/install-go
      - name: Restore the Go module and build caches for this cloud's simulator jobs
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Keyed on the dependency set, so it turns over when go.sum changes
          # and an older entry warms the incremental build until then.
          key: sim-go-${{ runner.os }}-${{ runner.arch }}-aws-${{ hashFiles('go.work', '**/go.sum') }}
          restore-keys: |
            sim-go-${{ runner.os }}-${{ runner.arch }}-aws-
      - name: Install Session Manager plugin
        run: |
          curl --fail --location --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            --output /tmp/session-manager-plugin.deb https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version
      - name: Install Caddy
        # TestECRCLI_DockerLoginPushPull serves the Amazon ECR private-registry
        # data plane over TLS through the repository's HTTPS gateway, which is
        # Caddy, because a container engine speaks TLS to a registry. That test
        # matches '^Test(...|ECR|...)', so only the compute shard runs it.
        if: matrix.suite == 'compute'
        run: |
          bash scripts/install-caddy.sh
      - name: Install latest AWS CLI v2
        # The ubuntu-runner-bundled aws CLI lags; newer service operations (e.g.
        # ECS Express Mode, launched 2025-11-21) need a current CLI. Install the
        # latest v2 so the cli-tests exercise every operation for real.
        run: |
          curl --fail --location --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          hash -r
          aws --version
      # Same contract as the SDK job: the CLI shards run real containers,
      # the Glue shard's python:3.9 among them.
      - name: Resolve the base images this job runs containers from
        id: base-images-list
        run: |
          images="$(bash scripts/base-images-for.sh simulator-aws | tr '\n' ' ')"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "digest=$({ printf '%s' "$images"; cat scripts/warm-base-images.sh; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "$images"
      - name: Restore the base images
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/base-images.tar
          # One entry per cloud, keyed on the image set itself, so every job
          # that runs that cloud's containers shares it: the set is fetched
          # once for the whole workflow rather than once per job, which is
          # what a cap counted in bytes actually responds to. A changed set restores
          # the nearest earlier entry and fetches only the images it lacks.
          key: base-images-${{ runner.os }}-${{ runner.arch }}-aws-${{ steps.base-images-list.outputs.digest }}
          restore-keys: |
            base-images-${{ runner.os }}-${{ runner.arch }}-aws-
      - name: Load or fetch the base images
        # Priming a cache, not checking a dependency: if the registry refuses an
        # image here, the job carries on and whatever actually needs it fails at
        # the point of use, naming it.
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          bash scripts/warm-base-images.sh ~/.cache/sockerless/base-images.tar \
            ${{ steps.base-images-list.outputs.images }}
      - name: Start the network sidecar image build
        # The suites' first workload waits on the sidecar image, and a cold
        # build takes longer than a test gives it; the build runs while the job
        # does other work, and the wait step below blocks on it.
        run: bash scripts/ci-engine-image.sh sidecar-image start
        timeout-minutes: 3
      # Download modules and compile the simulator and the CLI test binary in
      # their own budgeted step, as the runner user, so the timed test run
      # below holds the tests alone and what this compiles is what the cache
      # step saves.
      - name: Pre-build the simulator and the CLI tests (warm build cache)
        run: |
          bash scripts/ci-go-mod-download.sh simulator-aws
          bash scripts/ci-go-mod-download.sh simulator-aws/cli-tests
          cd simulator-aws && CGO_ENABLED=0 go build -o /dev/null .
          cd cli-tests && CGO_ENABLED=0 go test -c -o /dev/null .
        timeout-minutes: 10
      - name: Prepare the engine's trust directory and the low ports for the runner
        # The suite installs a registry's authority under /etc/docker/certs.d
        # for the engine to trust it and receives mail on port 25, and the
        # runner, not root, runs it.
        run: |
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /etc/docker/certs.d
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Wait for the network sidecar image
        run: bash scripts/ci-engine-image.sh sidecar-image wait
        timeout-minutes: 8
      - name: Run AWS CLI tests
        run: |
          cd simulator-aws
          env \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/aws-cli-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/aws" \
            make cli-test CLI_TEST_TIMEOUT=${{ matrix.timeout }} CLI_TEST_ARGS="-run '${{ matrix.run }}' ./..."
        timeout-minutes: ${{ matrix.timeout_minutes }}
      - name: Spec-shape ratchet (aws cli ${{ matrix.suite }})
        run: bash scripts/check-spec-violations.sh aws "$RUNNER_TEMP/aws-cli-spec-violations.jsonl"

  tf:
    needs: [verified-on-pr, warm-base-images]
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    # Stock hashicorp/aws / hashicorp/google / hashicorp/azurerm
    # providers run against the sim binary via `terraform init` +
    # `terraform apply -auto-approve`. Exercises the provider's
    # call-sequence shape, which differs materially from the SDK's.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The azure cloud runs as four shards: the shared `azurerm` stack, a
      # standalone `azurerm_subscription` config whose creates and cancels each
      # sit through the provider's fixed 60s StateChangeConf delay plus four
      # 10s confirmation polls, a standalone Microsoft Entra ID config driven
      # by the `azuread` provider, whose every create and delete sits through
      # that provider's own consistency polling, and a standalone App Service
      # deployment-slot config whose active-slot swap the provider polls on a
      # 10s interval. None of the standalone configs fits inside the shared
      # stack's budget under the repo-wide 15-minute job ceiling.
      matrix:
        include:
          - suite: aws
            cloud: aws
            tf_packages: "."
            timeout_minutes: 12
          - suite: aws Amazon ElastiCache
            cloud: aws
            tf_packages: "./elasticache"
            timeout_minutes: 12
          - suite: aws Amazon RDS instance
            cloud: aws
            tf_packages: "./rds-instance"
            timeout_minutes: 12
          - suite: aws Amazon RDS restore
            cloud: aws
            tf_packages: "./rds-restore ./rds-cluster-restore ./rds-cluster-s3-import"
            # Each stack starts its own simulator on ports it reserves and
            # spends most of its time in the provider's RDS status waits.
            tf_parallelism: 2
            timeout_minutes: 14
          # The provider waits a minute before its first poll of each
          # blue/green deployment and DB instance state it waits on, so the
          # stack's create, blue/green update and destroy take about nine
          # minutes of the test's twelve, leaving no room to load the whole
          # AWS base-image archive. The stack runs only its MySQL engine, the
          # snapshot volume copier and the ENI setup helper, so it warms those
          # alone: warming primes a cache, and an image missing from the list
          # is pulled where it is used.
          - suite: aws Amazon RDS blue/green deployment
            cloud: aws
            tf_packages: "./rds-blue-green"
            tf_timeout: 720s
            timeout_minutes: 15
            base_images: "mirror.gcr.io/library/mysql:8.0.46 mirror.gcr.io/library/alpine:3.22 mirror.gcr.io/library/busybox:latest"
          # The provider's create, replica and destroy waits take about six
          # minutes of the stack's test.
          - suite: aws Amazon RDS read replica
            cloud: aws
            tf_packages: "./rds-read-replica"
            tf_timeout: 720s
            timeout_minutes: 15
          # The provider waits on the create of the primary and its standby and
          # on the destroy; the test waits on the failover in between.
          - suite: aws Amazon RDS Multi-AZ
            cloud: aws
            tf_packages: "./rds-multi-az"
            tf_timeout: 720s
            timeout_minutes: 15
          # The stack waits for a maintenance window that opens two minutes
          # after its second apply.
          - suite: aws Amazon RDS parameter group
            cloud: aws
            tf_packages: "./rds-parameter-group"
            tf_timeout: 720s
            timeout_minutes: 15
          # The provider waits on the create, on the rename and port move,
          # and on the destroy.
          - suite: aws Amazon RDS instance settings
            cloud: aws
            tf_packages: "./rds-instance-settings"
            tf_timeout: 720s
            timeout_minutes: 15
          - suite: aws Amazon RDS snapshot
            cloud: aws
            tf_packages: "./rds-snapshot ./rds-cluster-snapshot"
            # The two stacks start their own simulator and gateway on ports
            # they reserve, and spend most of their time in the provider's
            # RDS status waits, so they run side by side rather than one
            # after the other against the job's budget.
            tf_parallelism: 2
            timeout_minutes: 14
          - suite: aws AWS Certificate Manager validation
            cloud: aws
            tf_packages: "./acm-validation"
            timeout_minutes: 12
          - suite: aws Amazon ECS Express Mode
            cloud: aws
            tf_packages: "./ecs-express"
            timeout_minutes: 12
          - suite: aws plan idempotency
            cloud: aws
            tf_packages: "./idempotency-fidelity"
            timeout_minutes: 12
          - suite: aws Amazon EC2 launch template
            cloud: aws
            tf_packages: "./launch-template ./ec2-instance-type ./ec2-instance"
            timeout_minutes: 12
          - suite: aws Amazon EC2 network interface
            cloud: aws
            tf_packages: "./network-interface ./nat-gateway-regional"
            timeout_minutes: 12
          - suite: aws tutorial
            cloud: aws
            tf_packages: "./tutorial"
            timeout_minutes: 15
          - suite: aws S3 control plane
            cloud: aws
            tf_packages: "./s3control ./s3-versioning ./s3-object-lock"
            timeout_minutes: 12
          - suite: aws Elastic Load Balancing
            cloud: aws
            tf_packages: "./elb-trust-store ./alb-forwarded-headers"
            timeout_minutes: 12
          - suite: aws Amazon ECR force delete
            cloud: aws
            tf_packages: "./ecr-force-delete ./ecr-image-size"
            timeout_minutes: 12
          - suite: aws AWS STS session tags
            cloud: aws
            tf_packages: "./sts-session-tags"
            timeout_minutes: 12
          - suite: aws Amazon SNS delivery status
            cloud: aws
            tf_packages: "./sns-delivery-status"
            timeout_minutes: 12
          - suite: aws AWS Lambda concurrency
            cloud: aws
            tf_packages: "./lambda-concurrency"
            timeout_minutes: 12
          - suite: gcp
            cloud: gcp
            tf_args: "-skip TestTerraformTutorial"
            timeout_minutes: 12
          - suite: gcp tutorial
            cloud: gcp
            tf_args: "-run TestTerraformTutorial"
            timeout_minutes: 12
          - suite: azure
            cloud: azure
            tf_timeout: 600s
            tf_run: TestTerraformApplyDestroy
            timeout_minutes: 12
          - suite: azure subscription
            cloud: azure
            tf_timeout: 780s
            tf_run: TestTerraformSubscriptionApplyDestroy
            timeout_minutes: 14
          - suite: azure entra
            cloud: azure
            tf_timeout: 780s
            tf_run: TestTerraformEntraApplyDestroy
            timeout_minutes: 14
          - suite: azure web app slots
            cloud: azure
            tf_timeout: 600s
            tf_run: TestTerraformWebAppSlotApplyDestroy
            timeout_minutes: 12
          - suite: azure resource group delete
            cloud: azure
            tf_timeout: 600s
            tf_run: TestTerraformResourceGroupDeleteTakesItsResources
            timeout_minutes: 12
          - suite: azure missing resource group
            cloud: azure
            tf_timeout: 600s
            tf_run: TestTerraformMissingResourceGroupRefusesApply
            timeout_minutes: 12
          - suite: azure redis cache
            cloud: azure
            tf_timeout: 600s
            tf_run: TestTerraformRedisCacheServesItsHostName
            timeout_minutes: 12
          - suite: azure front-end forwarded headers
            cloud: azure
            tf_timeout: 600s
            tf_run: TestTerraformFrontEndForwardedHeaders
            timeout_minutes: 12
          - suite: azure tutorial
            cloud: azure
            tf_timeout: 600s
            tf_run: TestTerraformTutorial
            timeout_minutes: 12
          - suite: azure web app key vault references and source control
            cloud: azure
            tf_timeout: 780s
            tf_run: TestTerraformWebAppKeyVault
            timeout_minutes: 15
    name: tf (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-go
        with:
          cache: 'true'
      # A Terraform stack runs the same real workloads the suites do, and the
      # registry caps anonymous requests by data volume — capturing an Amazon
      # RDS snapshot copies a volume through an alpine helper.
      - name: Resolve the base images this job runs containers from
        id: base-images-list
        run: |
          # A stack that names its base_images warms those alone (see its
          # matrix entry); every other stack warms its cloud's whole set.
          images="${{ matrix.base_images }}"
          if [ -z "$images" ]; then
            images="$(bash scripts/base-images-for.sh simulator-${{ matrix.cloud }} | tr '\n' ' ')"
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "digest=$({ printf '%s' "$images"; cat scripts/warm-base-images.sh; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "$images"
      - name: Restore the base images
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/base-images.tar
          # One entry per cloud, keyed on the image set itself, so every job
          # that runs that cloud's containers shares it: the set is fetched
          # once for the whole workflow rather than once per job, which is
          # what a cap counted in bytes actually responds to. A changed set restores
          # the nearest earlier entry and fetches only the images it lacks.
          key: base-images-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cloud }}-${{ steps.base-images-list.outputs.digest }}
          # A stack's own small set falls back to nothing: an earlier entry is
          # the cloud's whole archive, and loading it is the cost the small
          # set exists to avoid.
          restore-keys: ${{ !matrix.base_images && format('base-images-{0}-{1}-{2}-', runner.os, runner.arch, matrix.cloud) || '' }}
      - name: Load or fetch the base images
        # Priming a cache, not checking a dependency: if the registry refuses an
        # image here, the job carries on and whatever actually needs it fails at
        # the point of use, naming it.
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          bash scripts/warm-base-images.sh ~/.cache/sockerless/base-images.tar \
            ${{ steps.base-images-list.outputs.images }}
      - name: Start the network sidecar image build
        # The suites' first workload waits on the sidecar image, and a cold
        # build takes longer than a test gives it; the build runs while the job
        # does other work, and the wait step below blocks on it.
        run: bash scripts/ci-engine-image.sh sidecar-image start
        timeout-minutes: 3
      # Terraform is installed from its own release archive rather than
      # through hashicorp/setup-terraform: the runner downloads every action a
      # workflow references before it evaluates any step's condition, so an
      # action one job uses is fetched by all of them. The version is pinned
      # here.
      - name: Install Terraform
        env:
          TERRAFORM_VERSION: 1.16.0
        run: |
          set -euo pipefail
          archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          base="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/sums" \
            "$base/terraform_${TERRAFORM_VERSION}_SHA256SUMS"
          (cd "$RUNNER_TEMP" && grep " $archive\$" sums | sha256sum --check --strict -)
          unzip -q -o "$RUNNER_TEMP/$archive" -d /usr/local/bin terraform
          terraform version
        timeout-minutes: 3
      - name: Install Caddy
        run: |
          bash scripts/install-caddy.sh
      - name: Wait for the network sidecar image
        run: bash scripts/ci-engine-image.sh sidecar-image wait
        timeout-minutes: 8
      - name: Run terraform tests
        run: |
          cd simulator-${{ matrix.cloud }}
          export SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/${{ matrix.cloud }}-tf-spec-violations.jsonl"
          export SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/${{ matrix.cloud }}"
          if [ "${{ matrix.cloud }}" = "aws" ]; then
            env \
              SOCKERLESS_SPEC_VALIDATE="$SOCKERLESS_SPEC_VALIDATE" SOCKERLESS_SPEC_DIR="$SOCKERLESS_SPEC_DIR" \
              make terraform-https-test TERRAFORM_TEST_TIMEOUT=${{ matrix.tf_timeout || '600s' }} TERRAFORM_TEST_PACKAGES="${{ matrix.tf_packages }}" \
                TERRAFORM_TEST_PACKAGE_PARALLELISM="${{ matrix.tf_parallelism || 1 }}"
          elif [ "${{ matrix.cloud }}" = "azure" ]; then
            env \
              SOCKERLESS_SPEC_VALIDATE="$SOCKERLESS_SPEC_VALIDATE" SOCKERLESS_SPEC_DIR="$SOCKERLESS_SPEC_DIR" \
              make terraform-test TERRAFORM_TEST_TIMEOUT=${{ matrix.tf_timeout }} TERRAFORM_TEST_ARGS="-run ${{ matrix.tf_run }}"
          else
            env \
              SOCKERLESS_SPEC_VALIDATE="$SOCKERLESS_SPEC_VALIDATE" SOCKERLESS_SPEC_DIR="$SOCKERLESS_SPEC_DIR" \
              make terraform-https-test TERRAFORM_TEST_TIMEOUT=600s TERRAFORM_TEST_ARGS="${{ matrix.tf_args }}"
          fi
        # Must exceed the inner go-test deadline (TERRAFORM_TEST_TIMEOUT)
        # plus docker startup so the step never beats the test's own
        # watchdog, while staying inside the repo-wide 15-minute job
        # ceiling: 12 for the shared stacks and the two azure web app
        # shards (inner 600s), 14 for the azure subscription and azure entra
        # shards (inner 780s).
        timeout-minutes: ${{ matrix.timeout_minutes }}
      - name: Spec-shape ratchet (tf)
        run: bash scripts/check-spec-violations.sh ${{ matrix.cloud }} "$RUNNER_TEMP/${{ matrix.cloud }}-tf-spec-violations.jsonl"

  ui:
    needs: verified-on-pr
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A one-shot run on a fresh checkout has no use for turbo's background
    # daemon, and a build step has no business making a telemetry request: both
    # are work that can block without producing output. Each turbo step also carries its own
    # timeout, so a step that stops making progress is reported as the step it
    # stopped in rather than as the whole job running out of time.
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      # The console unit tests build and run the real simulators.
      - uses: ./.github/actions/install-go
        with:
          cache: 'true'
      - name: Install Bun
        uses: ./.github/actions/install-bun
      - run: cd ui && bun install --frozen-lockfile
        timeout-minutes: 3
      - run: cd ui && bunx turbo run build --no-daemon
        timeout-minutes: 4
      - run: cd ui && bunx turbo run typecheck --no-daemon
        timeout-minutes: 4
      - run: cd ui && bunx turbo run test --no-daemon
        timeout-minutes: 10

  ui-browser:
    needs: verified-on-pr
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    name: browser (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - simulator-aws
          - simulator-gcp
          - simulator-azure
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-go
        with:
          cache: 'true'
      - name: Install Bun
        uses: ./.github/actions/install-bun
      - run: cd ui && bun install --frozen-lockfile
      # The browser binaries are cached because the only thing between this job
      # and the network is a 177 MiB download that the lockfile pins exactly.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
      # Deliberately not --with-deps. The runner image already carries every
      # library Chromium links against, and the only packages it would add
      # are CJK, Thai and Cyrillic font packages no browser test renders,
      # fetched slowly enough to overrun the job budget. A missing library,
      # if the image ever drops one, fails loudly at browser launch naming
      # what is absent.
      - run: cd ui && bunx playwright install chromium
        timeout-minutes: 5
      # The suites run Chromium in a network namespace of its own, through
      # pasta, so the bridges and veth pairs the simulators' workloads add to
      # the engine do not abort its requests with ERR_NETWORK_CHANGED (see
      # ui/packages/core/e2e/isolated-chromium.sh). The namespace sits inside an
      # unprivileged user namespace, and Ubuntu 24.04's AppArmor denies
      # capabilities there to every program without a profile granting them,
      # which the runner image leaves in force.
      - name: Install pasta and allow unprivileged user namespaces
        run: |
          bash scripts/install-passt.sh
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: cd "ui/packages/${{ matrix.package }}" && bun run test:e2e

  race:
    needs: [verified-on-pr, warm-base-images]
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    # The simulators' own unit tests under the race detector.
    #
    # Its own job rather than a step in `sim`: that job's 15-minute ceiling is
    # already close for the Azure SDK suite, and a race build is slower than a
    # plain one. Its own job also means a race failure names itself in the check
    # list instead of hiding inside a suite that failed for some other reason.
    #
    # The simulator modules and the framework module (`race-sim` below) are
    # separate jobs, each with the full fifteen-minute ceiling: the go-test
    # deadline is per test binary, and the two are an order of magnitude apart
    # under the detector, so a single job sized for both would either starve one
    # or overrun the ceiling. The `sim` job splits its suites for the same reason.
    name: race (simulator-${{ matrix.cloud }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-go
        with:
          cache: 'true'
      # The simulator's tests run real containers, and the registries they pull
      # from throttle anonymous pulls: the Amazon ECR Public Gallery, which serves the
      # images AWS publishes, caps them by data volume — a cap that is not a
      # transient failure a retry recovers from. Caching the images means the
      # common case makes no registry request at all; on a miss the pull
      # happens exactly as before. The set is read out of the module so the
      # workflow holds no list to drift, and the key follows that set, so a test
      # that starts pulling something new gets a fresh cache rather than a stale
      # one that silently misses.
      - name: Resolve the base images this job runs containers from
        id: base-images-list
        run: |
          images="$(bash scripts/base-images-for.sh simulator-${{ matrix.cloud }} | tr '\n' ' ')"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "digest=$({ printf '%s' "$images"; cat scripts/warm-base-images.sh; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "$images"
      - name: Restore the base images
        # Restore only: when the archive is missing, the fetch takes this job
        # most of its budget, and saving the set (2.7 GB for AWS) does not fit
        # after it. The simulator suites and the warm job on main save the
        # archive.
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/sockerless/base-images.tar
          # One entry per cloud, keyed on the image set itself, so every job
          # that runs that cloud's containers shares it: the set is fetched
          # once for the whole workflow rather than once per job, which is
          # what a cap counted in bytes actually responds to. A changed set restores
          # the nearest earlier entry and fetches only the images it lacks.
          key: base-images-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cloud }}-${{ steps.base-images-list.outputs.digest }}
          restore-keys: |
            base-images-${{ runner.os }}-${{ runner.arch }}-${{ matrix.cloud }}-
      - name: Load or fetch the base images
        # Priming a cache, not checking a dependency: if the registry refuses an
        # image here, the job carries on and whatever actually needs it fails at
        # the point of use, naming it.
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          bash scripts/warm-base-images.sh ~/.cache/sockerless/base-images.tar \
            ${{ steps.base-images-list.outputs.images }}
      # The detector needs cgo, so the test binary is built differently from
      # every other job here and gets its own compile budget.
      - name: Pre-build the race test binary
        # A cold-cache race build of the Google Cloud or Azure simulator, with
        # their database data planes, takes several minutes; the step exists
        # to separate a slow build from a hung test, which eight minutes
        # still does.
        run: |
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}
          cd simulator-${{ matrix.cloud }}
          CGO_ENABLED=1 go test -race -count=1 -c -o /dev/null .
        timeout-minutes: 8
      - name: Run unit tests under the race detector
        run: |
          cd simulator-${{ matrix.cloud }}
          make race-test RACE_TEST_TIMEOUT=10m30s
        timeout-minutes: 11

  race-sim:
    needs: [verified-on-pr, warm-base-images]
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    # The framework module's own unit tests under the race detector. They run
    # real containers — the reaper, the startup sweep, the memory observer, the
    # VPC network allocator — so the job warms the same image cache the
    # simulator jobs use.
    name: race (sim)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-go
        with:
          cache: 'true'
      - name: Resolve the base images this job runs containers from
        id: base-images-list
        run: |
          images="$(bash scripts/base-images-for.sh sim | tr '\n' ' ')"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "digest=$({ printf '%s' "$images"; cat scripts/warm-base-images.sh; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "$images"
      - name: Restore the base images
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/base-images.tar
          key: base-images-${{ runner.os }}-${{ runner.arch }}-sim-${{ steps.base-images-list.outputs.digest }}
          restore-keys: |
            base-images-${{ runner.os }}-${{ runner.arch }}-sim-
      - name: Load or fetch the base images
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          bash scripts/warm-base-images.sh ~/.cache/sockerless/base-images.tar \
            ${{ steps.base-images-list.outputs.images }}
      - name: Pre-build the race test binary
        run: |
          bash scripts/ci-go-mod-download.sh sim
          cd sim
          CGO_ENABLED=1 go test -race -count=1 -c -o /dev/null .
        timeout-minutes: 8
      - name: Run unit tests under the race detector
        run: |
          cd sim
          make race-test RACE_TEST_TIMEOUT=10m30s
        timeout-minutes: 11

  node-agent:
    needs: [verified-on-pr, warm-base-images]
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    # The node agent's proof: the one job that needs /dev/kvm. It builds the
    # agent image on the runner's engine, which downloads Firecracker and the
    # guest kernel at their pinned digests, and boots a guest from an OCI image.
    name: firecracker (microVM arithmetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-go
        with:
          cache: 'true'
      - name: Resolve the base images this job runs containers from
        id: base-images-list
        run: |
          images="$(bash scripts/base-images-for.sh sim | tr '\n' ' ')"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "digest=$({ printf '%s' "$images"; cat scripts/warm-base-images.sh; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the base images
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/base-images.tar
          key: base-images-${{ runner.os }}-${{ runner.arch }}-sim-${{ steps.base-images-list.outputs.digest }}
          restore-keys: |
            base-images-${{ runner.os }}-${{ runner.arch }}-sim-
      - name: Load or fetch the base images
        continue-on-error: true
        run: |
          # shellcheck disable=SC2086
          bash scripts/warm-base-images.sh ~/.cache/sockerless/base-images.tar \
            ${{ steps.base-images-list.outputs.images }}
      - name: The runner offers KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Boot a guest through the node agent
        run: |
          bash scripts/ci-go-mod-download.sh sim
          make node-agent-test
        timeout-minutes: 13

  simulators-quality:
    needs: verified-on-pr
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    name: simulators (dead code + copy-paste)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-go
        with:
          cache: 'true'
      - name: Install Bun
        uses: ./.github/actions/install-bun
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.52.0
      - name: Install dupl
        run: go install github.com/mibk/dupl@v1.1.0
      - name: Install UI deps
        run: cd ui && bun install --frozen-lockfile
      - name: simulators deadcode
        run: bash scripts/simulators-deadcode.sh
      - name: simulators dupl (Go ≥150 tokens)
        run: bash scripts/simulators-dupl.sh
      - name: simulators knip (dead TS exports)
        run: bash scripts/simulators-knip.sh
      - name: simulators jscpd (UI ≥200 tokens)
        run: bash scripts/simulators-jscpd.sh

  # The release builds each simulator for four platforms; build-gates builds
  # the runner's, and this job the other three, each on a runner of its own,
  # because one cold cross-compile of the three simulators takes about six
  # minutes.
  release-platform-build:
    name: release platform build (${{ matrix.platform }})
    needs: verified-on-pr
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/install-go
      - name: Restore the Go module and build caches for this platform
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: release-platform-go-${{ strategy.job-index }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', '**/go.sum') }}
          restore-keys: |
            release-platform-go-${{ strategy.job-index }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Every simulator builds from its pinned modules for ${{ matrix.platform }}
        run: bash scripts/check-installable-build.sh "${{ matrix.platform }}"
        timeout-minutes: 12

  build-gates:
    needs: verified-on-pr
    if: ${{ !cancelled() && needs.verified-on-pr.outputs.verified != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      # install-go's own cache restores only an exact go.sum match, so a pin
      # or dependency move would leave the installable build compiling all
      # three simulators cold; the entry below falls back to the newest older
      # one, which warms the incremental build.
      - uses: ./.github/actions/install-go
      - name: Restore the Go module and build caches for the build gates
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: build-gates-go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', '**/go.sum') }}
          restore-keys: |
            build-gates-go-${{ runner.os }}-${{ runner.arch }}-
            sim-go-${{ runner.os }}-${{ runner.arch }}-aws-
      - name: Test the shared test helpers
        run: |
          bash scripts/ci-go-mod-download.sh testutil
          cd testutil && go test -count=1 ./...
        timeout-minutes: 5
      - name: Check simulator SDK/CLI/Terraform coverage matrix
        run: bash scripts/check-simulator-coverage-matrix.sh
        timeout-minutes: 5
      - name: Check generated simulator surface tables
        run: bash scripts/check-surface-tables-generated.sh
        timeout-minutes: 5
      - name: Check AWS behavioral pattern coverage registry
        run: bash scripts/check-behavioral-coverage.sh
        timeout-minutes: 5
      - name: Check AWS CLI shard coverage
        run: bash scripts/check-cli-shard-coverage.sh
        timeout-minutes: 5
      - name: Check AWS SDK shard coverage
        run: bash scripts/check-sdk-shard-coverage.sh
        timeout-minutes: 5
      - name: Check Azure CLI shard coverage
        run: bash scripts/check-azure-cli-shard-coverage.sh
        timeout-minutes: 5
      - name: Check Azure SDK shard coverage
        run: bash scripts/check-azure-sdk-shard-coverage.sh
        timeout-minutes: 5
      - name: Check AWS Terraform shard coverage
        run: bash scripts/check-tf-shard-coverage.sh
        timeout-minutes: 5
      - name: Check Azure Terraform shard coverage
        run: bash scripts/check-azure-tf-shard-coverage.sh
        timeout-minutes: 5
      - name: Mux-overlap scan
        run: bash scripts/scan-mux-overlap.sh
        timeout-minutes: 5
      - name: No case-fold-then-index slice-bounds class
        run: bash scripts/check-casefold-slice.sh
        timeout-minutes: 5
      - name: No store-mutex acquisition inside *Locked helpers
        run: bash scripts/check-locked-helpers.sh
        timeout-minutes: 5
      - name: No new skip-if-tool-absent tests
        run: bash scripts/check-no-tool-absent-skips.sh
        timeout-minutes: 5
      - name: No test passes without exercising what it names
        run: bash scripts/check-fake-tests.sh
        timeout-minutes: 5
      - name: Every SDK and CLI test runs in parallel or says why it cannot
        run: go run scripts/check-parallel-tests.go
        timeout-minutes: 5
      - name: Every test that places a workload holds a private range of its own in its suite
        run: go run scripts/check-test-network-ranges.go
        timeout-minutes: 5
      - name: No read path holds an exclusive lock
        run: bash scripts/check-readonly-locks.sh
        timeout-minutes: 5
      - name: Every read-write lock is released by its matching call
        run: bash scripts/check-lock-pairing.sh
        timeout-minutes: 5
      - name: No request path reads a whole store to find one row
        run: bash scripts/check-store-scans.sh
        timeout-minutes: 5
      - name: No script assigns a name zsh reserves
        run: bash scripts/check-zsh-special-vars.sh
        timeout-minutes: 5
      - name: Every gh api query parameter is one GitHub defines
        run: bash scripts/check-gh-api-params.sh
        timeout-minutes: 5
      - name: Every simulator builds from its pinned modules (go install path)
        run: bash scripts/check-installable-build.sh
        timeout-minutes: 5
      - name: Every pinned support module carries the working tree's content
        run: bash scripts/check-support-module-pins.sh
        timeout-minutes: 10
      - name: Check container publication contract
        run: bash scripts/check-container-publication.sh
        timeout-minutes: 5
      - name: Required status checks stay emittable
        run: bash scripts/check-required-status-checks.sh
        timeout-minutes: 5
      - name: GitHub Actions jobs finish within 15 minutes
        run: |
          bash scripts/test-workflow-timeouts.sh
          bash scripts/check-workflow-timeouts.sh
        timeout-minutes: 5
      - name: No commit's workflow run can be cancelled by a later commit
        run: |
          bash scripts/test-workflow-concurrency.sh
          bash scripts/check-workflow-concurrency.sh
        timeout-minutes: 5
      - name: The testing contract tells a moved registration from a new one
        run: bash scripts/test-check-simulator-tests.sh
        timeout-minutes: 5
