name: CI

env:
  FIRECRACKER_VERSION: v1.15.1
  GO_CACHE_DEPENDENCY_PATHS: |
    go.work
    **/go.sum

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Reusable so tag pushes can get full PR-level CI.
  workflow_call:

# Pull-request runs are keyed by head ref: a new push to a branch makes the
# run under way obsolete, and only the latest commit's verdict is wanted, so
# cancelling reclaims runners with nothing lost. Everything else is keyed by
# commit. A push to main carries a verdict for that commit alone — grouping
# main pushes together let each merge cancel its predecessor's CI, so a commit
# that is permanently in main's history ends with no result and none can be
# obtained without a manual re-run. A per-commit group has one member and is
# never superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: lint (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: simulators
            modules: simulator-aws simulator-gcp simulator-azure
            timeout_minutes: 10
          - shard: support
            modules: realexec testutil ui-auth
            timeout_minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Install golangci-lint
        # Built from source through the Go module proxy rather than fetched
        # from the GitHub releases CDN: the install script's own downloader
        # has no retry knobs and a releases-CDN 503 failed this job even with
        # the script fetch itself retried. The proxy is a different, immune
        # distribution path, and the warm Go build cache makes the build fast.
        run: |
          GOBIN="$(go env GOPATH)/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          "$(go env GOPATH)/bin/golangci-lint" --version
      - name: Lint
        run: |
          set -e
          for module in ${{ matrix.modules }}; do
            echo "=== $module ==="
            make "$module/lint"
          done
        timeout-minutes: ${{ matrix.timeout_minutes }}

  check-deps:
    name: check-deps (deps + actions + scripts)
    runs-on: ubuntu-latest
    # Every step here queries a live upstream — the GitHub API for two clouds'
    # specifications and Google's Discovery endpoints for the third, each
    # sampled several times — so the job's duration tracks those services
    # rather than anything in this repository. It has run in 4m52s and been
    # cancelled at the ten-minute ceiling on the same content; 15 is the
    # project's maximum and the honest budget for work that is mostly waiting
    # on somebody else's network.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Install script check tools
        run: bash scripts/ci-apt-install.sh jq shellcheck zsh
      - name: Check shell scripts
        run: |
          shellcheck -x -s bash scripts/*.sh
          bash -n scripts/*.sh
          zsh -n scripts/*.sh
      # The Actions half of this check reads the GitHub API. Unauthenticated
      # requests are rate limited, and a throttled reply is indistinguishable
      # from "this action has no newer tag", so the token is passed explicitly
      # rather than left to whatever quota the runner happens to have.
      #
      # A dependency must also have been public for at least a day before this
      # project adopts it, so the check holds versions younger than that instead
      # of reporting them as drift. The adoption quarantine is exercised in both
      # directions, with its negative controls, before the check itself runs —
      # a held version that should have been drift is the one way this gate
      # could go quiet without anyone noticing.
      - name: Adoption quarantine is exercised, negative controls included
        run: bash scripts/test-latest-deps-quarantine.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Attribution is the one change that can make this gate quieter, so it is
      # the one change that could make it stop gating. The controls prove a pin
      # the branch moved, and a pin the branch added, still fail with a baseline
      # in hand — run before the check itself, as the quarantine's are.
      - name: Dependency drift attribution is exercised, negative controls included
        run: bash scripts/test-latest-deps-baseline.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Both freshness checks below attribute drift against main, so main's tip
      # has to be a resolvable ref. The checkout is shallow; fetch just the one
      # commit the attribution reads.
      - name: Fetch main for drift attribution
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      # --baseline origin/main holds this branch to the dependencies it pinned.
      # The adoption quarantine guarantees a steady drip of new drift — a
      # version becomes drift exactly 86400s after publication whether or not
      # anybody pushed — and without a baseline that turned five of six
      # consecutive main runs red in a single day on docker/setup-buildx-action,
      # google.golang.org/grpc and aws-sdk-go-v2/service/organizations, none of
      # which any of those commits touched. Inherited rows are reported and
      # annotated here; the scheduled Dependency freshness workflow runs with no
      # baseline and is what fails on them.
      - name: Check dependency freshness (bash)
        run: bash scripts/check-latest-deps.sh --baseline origin/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check dependency freshness (zsh)
        run: zsh scripts/check-latest-deps.sh --baseline origin/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Drift attribution is exercised, negative controls included
        run: bash scripts/test-spec-freshness-baseline.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Every cloud's vendored specifications are gated, not just one: the
      # check takes a cloud argument, and each cloud is its own step so a
      # drift names the cloud that drifted. Each captures the newer document
      # it sampled so the refresh does not depend on the authoring machine's
      # edge serving the same revision the runner saw.
      #
      # --baseline origin/main holds this branch to the rows it touched. A row
      # whose pin the branch left as main recorded it drifted because upstream
      # moved, not because the branch let it rot, and failing here made a
      # branch's life a race against three separate upstreams — recorded in
      # detail in the script's header. Those rows are reported as INHERITED and
      # are failed by the scheduled Specification freshness workflow, which
      # runs against main with no baseline. A row the branch changed, rolled
      # back, or added is still held to upstream tip right here.
      - name: Check Amazon Web Services API specification freshness
        id: aws-spec-freshness
        # The AWS and Azure specifications live in GitHub repositories, so this
        # check resolves their upstream tip through the GitHub API.
        # Unauthenticated requests are rate limited and the script treats a
        # throttled reply as "cannot query upstream" — correctly refusing to
        # pass a gate it could not evaluate — so the token is passed explicitly.
        # Google Cloud's Discovery documents are fetched from Google's own
        # endpoints and need no token.
        run: bash scripts/check-spec-freshness.sh --baseline origin/main aws
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_FRESHNESS_CAPTURE_DIR: ${{ runner.temp }}/aws-spec-drift
      # Inherited drift no longer fails the step, so the capture is uploaded
      # whenever one was taken rather than only on failure: the artifact is
      # what the follow-up refresh vendors, and only the run that sampled the
      # newer document can produce it.
      - name: Preserve drifted Amazon Web Services API specifications
        if: ${{ !cancelled() && steps.aws-spec-freshness.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: aws-smithy-drift
          path: ${{ runner.temp }}/aws-spec-drift
          if-no-files-found: ignore
          retention-days: 1
      - name: Check Microsoft Azure API specification freshness
        id: azure-spec-freshness
        run: bash scripts/check-spec-freshness.sh --baseline origin/main azure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPEC_FRESHNESS_CAPTURE_DIR: ${{ runner.temp }}/azure-spec-drift
      - name: Preserve drifted Microsoft Azure API specifications
        if: ${{ !cancelled() && steps.azure-spec-freshness.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: azure-spec-drift
          path: ${{ runner.temp }}/azure-spec-drift
          if-no-files-found: ignore
          retention-days: 1
      - name: Check Google Cloud API specification freshness
        id: gcp-spec-freshness
        run: bash scripts/check-spec-freshness.sh --baseline origin/main gcp
        env:
          SPEC_FRESHNESS_CAPTURE_DIR: ${{ runner.temp }}/gcp-spec-drift
      - name: Preserve drifted Google Cloud API specifications
        if: ${{ !cancelled() && steps.gcp-spec-freshness.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gcp-discovery-drift
          path: ${{ runner.temp }}/gcp-spec-drift
          if-no-files-found: ignore
          retention-days: 1

  single-open-pr:
    name: At most one PR open
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: At most one PR open
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-single-open-pr.sh

  # pr-title: the squash-merge commit's title is the pull request title, and
  # release-please versions the repository by parsing main's history as
  # Conventional Commits — a title it cannot parse makes the merged work ship
  # in no release. The title arrives through env, never interpolated into the
  # script, so a crafted title cannot inject shell.
  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: PR title parses as a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-pr-title.sh "$PR_TITLE"

  # rebased-on-main: fail if the PR branch has fallen behind origin/main, so
  # every PR is tested (and merges) on top of the latest base.
  rebased-on-main:
    name: Branch rebased on origin/main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Branch must be rebased on origin/main
        run: bash scripts/check-rebased-on-main.sh

  firecracker:
    name: firecracker (microVM arithmetic)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/sockerless/firecracker-ci
          key: firecracker-ci-${{ env.FIRECRACKER_VERSION }}-${{ runner.arch }}-bin1
      - name: Install Firecracker test dependencies
        run: |
          bash scripts/ci-apt-install.sh curl e2fsprogs iproute2 iptables iputils-ping nftables openssh-client squashfs-tools
      - name: Install Firecracker
        run: bash scripts/install-firecracker.sh
      - name: Run Firecracker arithmetic smoke
        run: make firecracker-test
      - name: Run real-execution network/NIC smoke
        run: make realexec-network-test

  sim:
    # VM-backed simulator slices require /dev/kvm for real Firecracker guests.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every combination is listed rather than crossed, because one of them
        # is split in two and a cross product cannot express that.
        #
        # The SDK and CLI suites run as separate jobs so each gets its own
        # 15-minute ceiling: the Azure SDK suite's Cosmos DB emulator
        # differential tests alone approach the ceiling, leaving no room to run
        # the CLI suite in the same job.
        #
        # The Azure CLI suite is then split again. Unsharded it measured 680
        # seconds across 171 tests against a fourteen-minute step allowance,
        # with its inner deadline already at thirteen minutes — the most it can
        # be before a breach stops producing a named Go stack and becomes an
        # opaque step kill. That left under two minutes of headroom for a suite
        # that had roughly doubled in a single pass. Its names partition
        # cleanly: all 171 match `Test[A-Z]`, 99 in A-M and 72 in N-Z.
        include:
          - cloud: gcp
            suite: sdk
          - cloud: gcp
            suite: cli
          # The Azure SDK suite is split the same way, and for the same reason:
          # at 681 seconds of test time across 537 tests it reached a
          # fourteen-minute step allowance whose inner deadline is already at
          # thirteen minutes, and a run that overshoots is cancelled rather
          # than reported. The split is by cost rather than by count, because
          # the cost is not spread evenly over the alphabet: the names
          # beginning with A — the resource-move family and the PostgreSQL
          # flexible-server tests — are 346 seconds on their own, and every
          # other letter together is 335.
          - cloud: azure
            suite: sdk
            shard: A
            run: '^TestA'
          - cloud: azure
            suite: sdk
            shard: B-Z
            run: '^Test[B-Z]'
          - cloud: azure
            suite: cli
            shard: A-M
            run: '^Test[A-M]'
          - cloud: azure
            suite: cli
            shard: N-Z
            run: '^Test[N-Z]'
    name: sim (${{ matrix.cloud }} ${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      # Simulator runs mutate the restored guest rootfs as root. Restore the
      # immutable seed produced by the dedicated Firecracker job, but never
      # archive the test-mutated tree from a matrix job.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/sockerless/firecracker-ci
          key: firecracker-ci-${{ env.FIRECRACKER_VERSION }}-${{ runner.arch }}-bin1
      # The Cloud Firestore emulator is a Java program, and the component
      # refuses anything below a Java 21 runtime, which the runner's default
      # `java` is not. The runner does ship newer runtimes alongside it, each
      # announced through a JAVA_HOME_<major>_<arch> variable, so the newest one
      # that satisfies the emulator goes on PATH ahead of the default.
      #
      # Deliberately not actions/setup-java: the runner downloads every action a
      # workflow references before it evaluates any step's condition, so a
      # gcp-only action step costs every job in the matrix one more tarball
      # fetch from codeload — and those fetches are already being throttled
      # (BUG-56). A step that reads what is installed costs nothing.
      - name: Put the Java runtime the Cloud Firestore emulator requires on PATH
        if: matrix.cloud == 'gcp'
        run: |
          best=""
          best_major=0
          while IFS='=' read -r name home; do
            case "$name" in JAVA_HOME_*) ;; *) continue ;; esac
            major=${name#JAVA_HOME_}
            major=${major%%_*}
            case "$major" in ''|*[!0-9]*) continue ;; esac
            [ -x "$home/bin/java" ] || continue
            [ "$major" -ge 21 ] || continue
            [ "$major" -gt "$best_major" ] || continue
            best_major=$major
            best=$home
          done <<<"$(env)"
          if [ -z "$best" ]; then
            echo "No Java 21+ runtime is installed on this runner; the Cloud Firestore emulator cannot start without one." >&2
            env | grep '^JAVA_HOME' >&2 || echo "(the runner announced no JAVA_HOME_* runtimes at all)" >&2
            exit 1
          fi
          echo "Using Java $best_major from $best"
          echo "$best/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$best" >> "$GITHUB_ENV"
      - name: Install gcloud CLI
        if: matrix.cloud == 'gcp'
        run: |
          archive="$RUNNER_TEMP/google-cloud-cli-linux-x86_64.tar.gz"
          curl --fail --location --show-error --silent --http1.1 \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            --output "$archive" \
            https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz
          tar -xzf "$archive" -C "$HOME"
          echo "$HOME/google-cloud-sdk/bin" >> "$GITHUB_PATH"
          # The Firestore-emulator component is the differential-test oracle for
          # TestFirestore_DifferentialVsEmulator; the step above provides the
          # Java runtime it runs on.
          "$HOME/google-cloud-sdk/bin/gcloud" components install cloud-firestore-emulator beta --quiet
      # The runner image ships an Azure CLI, and it lags Microsoft's releases —
      # the AWS CLI and gcloud steps above each fetch the newest build, so
      # testing Azure against whatever the image happened to bake in was the one
      # cloud whose client was not current. Install the newest, as they do.
      - name: Install Azure CLI
        if: matrix.cloud == 'azure'
        run: |
          curl --fail --location --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            https://aka.ms/InstallAzureCLIDeb | sudo bash
          hash -r
          az version
      - name: Install real-execution tools
        run: |
          bash scripts/ci-apt-install.sh curl e2fsprogs iproute2 iputils-ping nftables procps squashfs-tools
          bash scripts/install-firecracker.sh
      - name: Install Caddy
        # TestArtifactRegistryCLI_DockerLoginPushPull serves the Google Artifact
        # Registry Docker data plane over TLS through the repository's HTTPS
        # gateway, which is Caddy, because a container engine speaks TLS to a
        # registry.
        if: matrix.cloud == 'gcp' && matrix.suite == 'cli'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y caddy
          caddy version
      # Module download + test-binary compilation get their own budget so the
      # timed run below isn't eaten by a cold module cache after a dep change
      # busts the shared **/go.sum Go cache.
      - name: Pre-build module unit tests (warm build cache)
        if: matrix.suite == 'sdk'
        run: |
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}
          cd simulator-${{ matrix.cloud }}
          CGO_ENABLED=0 go test -tags noui -count=1 -c -o /dev/null .
          CGO_ENABLED=0 go test -tags noui -count=1 -c -o /dev/null ./shared
        timeout-minutes: 8
      - name: Run module unit tests
        # Shard-independent; the sdk suite carries them so they run once per
        # cloud. The inner deadline sits under the step budget so a hung test
        # fails with a named Go stack rather than an opaque step kill.
        if: matrix.suite == 'sdk'
        run: cd simulator-${{ matrix.cloud }} && make unit-test UNIT_TEST_TIMEOUT=2m30s
        timeout-minutes: 3
      # Pre-pull the Cosmos DB emulator (the differential-test oracle for
      # TestCosmos_DifferentialVsEmulator). The differential pulls the image
      # itself when it is absent; pre-pulling only keeps that download out of
      # the go-test deadline so the job budget stays predictable.
      - name: Pull Cosmos DB emulator (differential oracle)
        if: matrix.cloud == 'azure' && matrix.suite == 'sdk'
        run: docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
        timeout-minutes: 8
      - name: Run SDK tests
        if: matrix.suite == 'sdk'
        run: |
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}/sdk-tests
          cd simulator-${{ matrix.cloud }}
          sudo env "PATH=$PATH" "HOME=$HOME" \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/${{ matrix.cloud }}-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/${{ matrix.cloud }}" \
            make sdk-test ${{ matrix.run && format('SDK_TEST_ARGS="-run ''{0}'' ./..."', matrix.run) || '' }}
        # Headroom over the inner go-test deadline (SDK_TEST_TIMEOUT, 13m) so a
        # suite that overruns fails with a named Go stack rather than an opaque
        # step kill.
        timeout-minutes: 14
      - name: Run CLI tests
        if: matrix.suite == 'cli'
        run: |
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}/cli-tests
          cd simulator-${{ matrix.cloud }}
          sudo env "PATH=$PATH" "HOME=$HOME" \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/${{ matrix.cloud }}-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/${{ matrix.cloud }}" \
            make cli-test ${{ matrix.run && format('CLI_TEST_ARGS="-run ''{0}'' ./..."', matrix.run) || '' }}
        timeout-minutes: 14
      # Each shard ratchets what its own run produced. The gate fails on any key
      # its report holds that the allowlist does not, so a partial report can
      # never pass a violation the other shard would have caught — the two
      # together cover every test, and each one still refuses to pass a report
      # the validator did not write at all.
      - name: Spec-shape ratchet
        run: bash scripts/check-spec-violations.sh ${{ matrix.cloud }} "$RUNNER_TEMP/${{ matrix.cloud }}-spec-violations.jsonl"

  sim-aws-sdk:
    # The AWS SDK suite outgrew a single 15-minute job (the full run reached
    # the ceiling on runner-speed variance), so it fans out across four shards
    # the way the AWS CLI suite does. Shard regexes use the character-class form
    # ('^Test[...]') rather than the CLI shards' alternation form
    # ('^Test(...)') so each suite's coverage gate reads only its own shard
    # set; scripts/check-sdk-shard-coverage.sh asserts every SDK test matches
    # exactly one shard.
    name: sim (aws sdk ${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: compute
            run: '^Test[E]'
          - suite: data
            run: '^Test[D]'
          - suite: services-a-m
            run: '^Test[A-CF-M]'
          - suite: services-n-z
            run: '^Test[N-Z]'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/sockerless/firecracker-ci
          key: firecracker-ci-${{ env.FIRECRACKER_VERSION }}-${{ runner.arch }}-bin1
      - name: Install real-execution tools
        # Firecracker and the netns toolchain back the Amazon EC2 real-execution
        # tests, which all live in the compute shard ('^Test[E]'); the other
        # shards skip this install so apt/network variance can't erode their
        # 15-minute budget.
        if: matrix.suite == 'compute'
        run: |
          bash scripts/ci-apt-install.sh curl e2fsprogs iproute2 iputils-ping nftables procps squashfs-tools
          bash scripts/install-firecracker.sh
      # Download modules and compile the unit-test binaries in their own
      # budgeted step, so the timed test run below isn't eaten by a cold
      # module cache after a dep change busts the shared **/go.sum Go cache —
      # the same separation the SDK pre-build step below makes for the same
      # reason.
      - name: Pre-build AWS module unit tests (warm build cache)
        if: matrix.suite == 'services-n-z'
        run: |
          bash scripts/ci-go-mod-download.sh simulator-aws
          cd simulator-aws
          CGO_ENABLED=0 go test -tags noui -count=1 -c -o /dev/null .
          CGO_ENABLED=0 go test -tags noui -count=1 -c -o /dev/null ./shared
        timeout-minutes: 8
      - name: Run AWS module unit tests
        # The module unit tests are shard-independent; one shard carries them
        # so they run exactly once per workflow. The shared/ suite carries a
        # real SQLite durability soak, so the run step's budget holds the
        # suite alone — compilation happened above. The inner deadline sits
        # under the step budget so a hung test fails with a named Go stack
        # rather than an opaque step kill.
        if: matrix.suite == 'services-n-z'
        run: cd simulator-aws && make unit-test UNIT_TEST_TIMEOUT=5m30s
        timeout-minutes: 6
      # Compile the sim binary + the (large, AWS-SDK-importing) SDK test binary
      # in a separate deterministic build step, so the timed test run below isn't
      # eaten by a cold recompile after an unrelated dep change busts the shared
      # **/go.sum Go cache. Build time gets its own budget; the test keeps a
      # tight one.
      - name: Pre-build AWS SDK tests (warm build cache)
        run: |
          bash scripts/ci-go-mod-download.sh simulator-aws
          cd simulator-aws && make build
          cd sdk-tests && CGO_ENABLED=0 go test -c -o /tmp/aws-sdk-tests.test .
        # This step exists to absorb a cold build, so its budget has to fit
        # one: measured at 3m16s against a warm cache and over six minutes
        # against an empty one. Six minutes was under twice the warm cost,
        # which is no margin for the case the step is for.
        timeout-minutes: 10
      # Free disk before the timed run — but never the Go caches. Deleting
      # those poisons the cache for every later job: setup-go saves at
      # post-job, a branch's first run restores the default branch's entry and
      # is therefore not an exact hit in its own scope, so it saves what it
      # has, which after this step is nothing. Measured on this branch: the
      # entry under the shared key went from 224,164,847 bytes to 7,564, and
      # the pre-build step that takes 3m16s warm hit its six-minute ceiling
      # twice.
      #
      # The deletion was not buying much either. Measured on the run before it:
      # 83 GB free before, 89 GB after, on a 145 GB disk at 43% used. The
      # container images and apt lists are the part worth reclaiming.
      - name: Free AWS SDK runner disk before execution
        run: |
          df -h
          go clean -testcache
          rm -rf "$RUNNER_TEMP/go-build"
          docker image prune -af
          sudo apt-get clean
          df -h
        timeout-minutes: 3
      # Pre-pull the DynamoDB Local differential oracle so the timed test run
      # below doesn't spend its budget on the image fetch (the differential test
      # checks the local image store before pulling). DynamoDB Local is the
      # reference oracle for the TestDynamoDB_DifferentialVsLocal sweep.
      - name: Pull DynamoDB Local (differential oracle)
        # TestDynamoDB_DifferentialVsLocal lives in the data shard.
        if: matrix.suite == 'data'
        # A registry answering "toomanyrequests" is telling us to wait, not that
        # the image is unavailable — the same signal a client is expected to
        # back off on. Anonymous pulls share a per-address budget with every
        # other runner on the same egress, so one throttled attempt is not a
        # verdict. Retry with widening backoff and fail loudly if the budget
        # never frees up.
        run: |
          set -o pipefail
          image=public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:latest
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then exit 0; fi
            delay=$((attempt * 15))
            echo "pull attempt $attempt failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done
          echo "could not pull $image after 5 attempts" >&2
          exit 1
        timeout-minutes: 6
      - name: Pull the Batch job image (workload container)
        # TestBatch_JobSubmitDescribe_SDK runs a real container from
        # public.ecr.aws; a pull inside the timed test run has failed on a
        # registry token timeout ("context deadline exceeded" fetching the
        # auth token), which surfaced as the job FAILED rather than as what it
        # was — the network. Same retry/backoff contract as the DynamoDB
        # oracle pull above.
        if: matrix.suite == 'services-a-m'
        run: |
          set -o pipefail
          image=public.ecr.aws/docker/library/alpine:3
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then exit 0; fi
            delay=$((attempt * 15))
            echo "pull attempt $attempt failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done
          echo "could not pull $image after 5 attempts" >&2
          exit 1
        timeout-minutes: 6
      - name: Run AWS SDK tests
        # The suite has exhausted the runner volume from a 89 GB starting
        # margin, killing the runner process as it wrote its own diagnostic log
        # — which destroyed the job log along with it, so nothing identified the
        # writer. Output goes to a file under a watched budget instead: if the
        # log or the volume crosses its threshold, the run stops and reports the
        # largest relevant consumers through bounded scans while there is still
        # disk to report them on.
        run: |
          set -o pipefail
          cd simulator-aws/sdk-tests
          log="$RUNNER_TEMP/aws-sdk-tests.out"
          report() {
            echo "=== volume ==="; df -h /
            echo "=== test output size ==="; du -h "$log" 2>/dev/null || true
            echo "=== docker ==="; docker system df 2>/dev/null || true
          }
          report_consumers() {
            echo "=== largest relevant consumers ==="
            for path in "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp/sockerless-firecracker; do
              if [ -e "$path" ]; then
                echo "--- $path ---"
                sudo timeout 5s du -x -m -d 2 "$path" \
                  | sort -rn | sed -n '1,10p' \
                  || echo "::warning::Disk-consumer scan did not complete within 5 seconds: $path"
              fi
            done
          }
          # The runner shell owns the diagnostic log; only the test process needs root.
          # shellcheck disable=SC2024
          sudo env "PATH=$PATH" "HOME=$HOME" \
            SOCKERLESS_AWS_SIMULATOR_BINARY="$GITHUB_WORKSPACE/simulator-aws/simulator-aws" \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/aws-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/aws" \
            /tmp/aws-sdk-tests.test -test.v -test.count=1 -test.timeout=600s -test.run "$SHARD_RUN" > "$log" 2>&1 &
          test_pid=$!
          while kill -0 "$test_pid" 2>/dev/null; do
            log_mb=$(( $(stat -c %s "$log" 2>/dev/null || echo 0) / 1048576 ))
            free_mb=$(df -m --output=avail / | tail -1 | tr -d ' ')
            if [ "$log_mb" -gt 2048 ] || [ "$free_mb" -lt 8192 ]; then
              echo "::error::AWS SDK tests exceeded their disk budget (output ${log_mb} MB, ${free_mb} MB free)."
              echo "--- last 200 lines before the budget was hit ---"
              tail -n 200 "$log" || true
              report
              report_consumers
              sudo kill -QUIT "$test_pid" 2>/dev/null || true
              sleep 10
              sudo kill -9 "$test_pid" 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done
          # The step runs under `bash -e`; guard the wait with `|| status=$?`
          # so a failing test binary does not abort the step before `cat "$log"`
          # prints which test failed — an unguarded `wait` swallowed the entire
          # diagnostic on a real failure.
          status=0
          wait "$test_pid" || status=$?
          cat "$log"
          report
          exit "$status"
        # The suite grows as services reach full op-coverage; give the step
        # headroom over the inner go-test deadline (SDK_TEST_TIMEOUT) so a hung
        # test fails with a named Go stack rather than an opaque step kill.
        timeout-minutes: 12
        env:
          SHARD_RUN: ${{ matrix.run }}
      - name: Spec-shape ratchet (aws sdk ${{ matrix.suite }})
        run: bash scripts/check-spec-violations.sh aws "$RUNNER_TEMP/aws-spec-violations.jsonl"

  sim-aws-cli:
    name: sim (aws cli ${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: edge-routing
            run: '^Test(ACM|Amplify|APIGateway|ApplicationAutoScaling|AutoScaling|Batch|Budgets|PrivateCA)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: edge-delivery
            run: '^Test(CloudFront|CloudTrail|CodeBuild|ELBv2|Firehose)'
            timeout: 1200s
            timeout_minutes: 15
          # AWS Glue and IAM moved out of the edge-delivery and appdata shards
          # after both jobs reached their measured 15-minute budget edge
          # (14.4m); together they run well inside one shard's budget.
          - suite: glue-iam
            run: '^Test(Glue|IAM)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: ec2-a-m
            run: '^Test(EC2(CLI_[A-M]|Copy|EBS|Instance|Key|Launch))'
            timeout: 1500s
            timeout_minutes: 15
          - suite: ec2-n-z
            run: '^Test(EC2(CLI_[N-Z]|Nat|Network|Routing|Security|Subnet))'
            timeout: 1500s
            timeout_minutes: 15
          - suite: compute
            run: '^Test(CloudMap|DynamoDB|CLI_ECR|ECR|EFS|Logs)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: ecs
            run: '^Test(ECS)'
            timeout: 1200s
            timeout_minutes: 15
          # appdata split in two after the shard hit its 15-minute job budget
          # on a cold Go build cache: the CLI test binary's cold compile takes
          # about eight minutes, so a shard's suite must fit the remainder.
          - suite: appdata
            run: '^Test(CloudWatch|EventBridge|Kinesis|ResourceTags)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: appdata4
            run: '^Test(ElastiCache|KMS|Lambda|Organizations)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: appdata2
            run: '^Test(AWSServiceState|RDS|Route53|S3)'
            timeout: 1200s
            timeout_minutes: 15
          - suite: appdata3
            run: '^Test(Scheduler|SecretsManager|SFN|SNS|SQS|SSM|STS|WAFv2)'
            timeout: 1200s
            timeout_minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/sockerless/firecracker-ci
          key: firecracker-ci-${{ env.FIRECRACKER_VERSION }}-${{ runner.arch }}-bin1
      - name: Install real-execution tools
        run: |
          bash scripts/ci-apt-install.sh curl e2fsprogs iproute2 iputils-ping nftables procps squashfs-tools
          bash scripts/install-firecracker.sh
      - name: Install Session Manager plugin
        run: |
          curl --fail --location --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            --output /tmp/session-manager-plugin.deb https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version
      - name: Install Caddy
        # TestECRCLI_DockerLoginPushPull serves the Amazon ECR private-registry
        # data plane over TLS through the repository's HTTPS gateway, which is
        # Caddy, because a container engine speaks TLS to a registry. That test
        # matches '^Test(...|ECR|...)', so only the compute shard runs it.
        if: matrix.suite == 'compute'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y caddy
          caddy version
      - name: Install latest AWS CLI v2
        # The ubuntu-runner-bundled aws CLI lags; newer service operations (e.g.
        # ECS Express Mode, launched 2025-11-21) need a current CLI. Install the
        # latest v2 so the cli-tests exercise every operation for real.
        run: |
          curl --fail --location --show-error --silent \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 300 \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          hash -r
          aws --version
      - name: Run AWS CLI tests
        run: |
          bash scripts/ci-go-mod-download.sh simulator-aws
          cd simulator-aws
          sudo env "PATH=$PATH" "HOME=$HOME" \
            SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/aws-cli-spec-violations.jsonl" \
            SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/aws" \
            make cli-test CLI_TEST_TIMEOUT=${{ matrix.timeout }} CLI_TEST_ARGS="-run '${{ matrix.run }}' ./..."
        timeout-minutes: ${{ matrix.timeout_minutes }}
      - name: Spec-shape ratchet (aws cli ${{ matrix.suite }})
        run: bash scripts/check-spec-violations.sh aws "$RUNNER_TEMP/aws-cli-spec-violations.jsonl"

  tf:
    # Stock hashicorp/aws / hashicorp/google / hashicorp/azurerm
    # providers run against the sim binary via `terraform init` +
    # `terraform apply -auto-approve`. Exercises the provider's
    # call-sequence shape, which differs materially from the SDK's.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The azure cloud runs as three shards: the shared `azurerm` stack, a
      # standalone `azurerm_subscription` config whose creates and cancels each
      # sit through the provider's fixed 60s StateChangeConf delay plus four
      # 10s confirmation polls, and a standalone Microsoft Entra ID config
      # driven by the `azuread` provider, whose every create and delete sits
      # through that provider's own consistency polling. Neither standalone
      # config fits inside the shared stack's budget under the repo-wide
      # 15-minute job ceiling.
      matrix:
        include:
          - suite: aws
            cloud: aws
            tf_packages: "."
            timeout_minutes: 12
          - suite: aws Amazon ElastiCache
            cloud: aws
            tf_packages: "./elasticache"
            timeout_minutes: 12
          - suite: aws Amazon RDS instance
            cloud: aws
            tf_packages: "./rds-instance"
            timeout_minutes: 12
          - suite: aws Amazon RDS restore
            cloud: aws
            tf_packages: "./rds-restore"
            timeout_minutes: 12
          - suite: aws Amazon RDS snapshot
            cloud: aws
            tf_packages: "./rds-snapshot"
            timeout_minutes: 12
          - suite: aws AWS Certificate Manager validation
            cloud: aws
            tf_packages: "./acm-validation"
            timeout_minutes: 12
          - suite: aws Amazon ECS Express Mode
            cloud: aws
            tf_packages: "./ecs-express"
            timeout_minutes: 12
          - suite: aws plan idempotency
            cloud: aws
            tf_packages: "./idempotency-fidelity"
            timeout_minutes: 12
          - suite: aws Amazon EC2 launch template
            cloud: aws
            tf_packages: "./launch-template"
            timeout_minutes: 12
          - suite: aws Amazon EC2 network interface
            cloud: aws
            tf_packages: "./network-interface"
            timeout_minutes: 12
          - suite: gcp
            cloud: gcp
            timeout_minutes: 12
          - suite: azure
            cloud: azure
            tf_timeout: 600s
            tf_run: TestTerraformApplyDestroy
            timeout_minutes: 12
          - suite: azure subscription
            cloud: azure
            tf_timeout: 780s
            tf_run: TestTerraformSubscriptionApplyDestroy
            timeout_minutes: 14
          - suite: azure entra
            cloud: azure
            tf_timeout: 780s
            tf_run: TestTerraformEntraApplyDestroy
            timeout_minutes: 14
    name: tf (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/sockerless/firecracker-ci
          key: firecracker-ci-${{ env.FIRECRACKER_VERSION }}-${{ runner.arch }}-bin1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false
      - name: Install real-execution tools
        run: |
          bash scripts/ci-apt-install.sh curl e2fsprogs iproute2 iputils-ping nftables procps squashfs-tools
          bash scripts/install-firecracker.sh
      - name: Install Caddy
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y caddy
      # The base images these suites run containers from come from registries
      # that rate-limit anonymous pulls by data volume, and a data cap is not a
      # transient failure a retry recovers from — the Azure suite exhausted four
      # backoff attempts on alpine and stopped the job. Caching the images means
      # the common case makes no registry request at all; on a miss the pull
      # happens exactly as before, so the worst case is today's behaviour.
      - name: Restore the base images
        id: base-images
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/sockerless/base-images.tar
          key: base-images-${{ runner.os }}-${{ runner.arch }}-alpine-latest-v1
      - name: Load or fetch the base images
        run: bash scripts/warm-base-images.sh ~/.cache/sockerless/base-images.tar public.ecr.aws/docker/library/alpine:latest
      - name: Run terraform tests
        run: |
          cd simulator-${{ matrix.cloud }}
          export SOCKERLESS_SPEC_VALIDATE="$RUNNER_TEMP/${{ matrix.cloud }}-tf-spec-violations.jsonl"
          export SOCKERLESS_SPEC_DIR="$GITHUB_WORKSPACE/specs/cloud-api/${{ matrix.cloud }}"
          if [ "${{ matrix.cloud }}" = "aws" ]; then
            sudo env "PATH=$PATH" "HOME=$HOME" \
              SOCKERLESS_SPEC_VALIDATE="$SOCKERLESS_SPEC_VALIDATE" SOCKERLESS_SPEC_DIR="$SOCKERLESS_SPEC_DIR" \
              make terraform-https-test TERRAFORM_TEST_TIMEOUT=600s TERRAFORM_TEST_PACKAGES="${{ matrix.tf_packages }}"
          elif [ "${{ matrix.cloud }}" = "azure" ]; then
            sudo env "PATH=$PATH" "HOME=$HOME" \
              SOCKERLESS_SPEC_VALIDATE="$SOCKERLESS_SPEC_VALIDATE" SOCKERLESS_SPEC_DIR="$SOCKERLESS_SPEC_DIR" \
              make terraform-test TERRAFORM_TEST_TIMEOUT=${{ matrix.tf_timeout }} TERRAFORM_TEST_ARGS="-run ${{ matrix.tf_run }}"
          else
            sudo env "PATH=$PATH" "HOME=$HOME" \
              SOCKERLESS_SPEC_VALIDATE="$SOCKERLESS_SPEC_VALIDATE" SOCKERLESS_SPEC_DIR="$SOCKERLESS_SPEC_DIR" \
              make terraform-https-test
          fi
        # Must exceed the inner go-test deadline (TERRAFORM_TEST_TIMEOUT)
        # plus docker startup so the step never beats the test's own
        # watchdog, while staying inside the repo-wide 15-minute job
        # ceiling: 12 for the shared stacks (inner 600s), 14 for the
        # azure subscription and azure entra shards (inner 780s).
        timeout-minutes: ${{ matrix.timeout_minutes }}
      - name: Spec-shape ratchet (tf)
        run: bash scripts/check-spec-violations.sh ${{ matrix.cloud }} "$RUNNER_TEMP/${{ matrix.cloud }}-tf-spec-violations.jsonl"

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # A one-shot run on a fresh checkout has no use for turbo's background
    # daemon, and a build step has no business making a telemetry request: both
    # are work that can block without producing output, on a job whose real
    # work takes about two minutes. Each turbo step also carries its own
    # timeout, so a step that stops making progress is reported as the step it
    # stopped in rather than as the whole job running out of time.
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3'
      - run: cd ui && bun install --frozen-lockfile
        timeout-minutes: 3
      - run: cd ui && bunx turbo run build --no-daemon
        timeout-minutes: 4
      - run: cd ui && bunx turbo run typecheck --no-daemon
        timeout-minutes: 4
      - run: cd ui && bunx turbo run test --no-daemon
        timeout-minutes: 6

  ui-browser:
    name: browser (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - simulator-aws
          - simulator-gcp
          - simulator-azure
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3'
      - run: cd ui && bun install --frozen-lockfile
      # The browser binaries are cached because the only thing between this job
      # and the network is a 177 MiB download that the lockfile pins exactly.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
      # Deliberately not --with-deps. The runner image already carries every
      # library Chromium links against — a --with-deps run reports all of them
      # "already the newest version" — so the only packages it adds are nine
      # CJK, Thai and Cyrillic font packages no browser test renders. Fetching
      # them cost 10min 22s at 33.9 kB/s on one run, which overran the job
      # budget and cancelled the tests. A missing library, if the image ever
      # drops one, fails loudly at browser launch naming what is absent.
      - run: cd ui && bunx playwright install chromium
        timeout-minutes: 5
      - run: cd "ui/packages/${{ matrix.package }}" && bun run test:e2e

  race:
    # The simulators' own unit tests under the race detector.
    #
    # Its own job rather than a step in `sim`: that job's 15-minute ceiling is
    # already close for the Azure SDK suite, and a race build is slower than a
    # plain one. Its own job also means a race failure names itself in the check
    # list instead of hiding inside a suite that failed for some other reason.
    #
    # The first race-detector run of the AWS module reported 144 races. Every
    # one was asynchronous simulator work — reconciliations, builds,
    # deployments, certificate validation — running in goroutines and timers
    # that nothing tracked, so work still in flight when its test ended read
    # package-level stores the next test was replacing. simulator-aws/
    # background_work.go counts all of it now. They were found by running the
    # detector by hand, and a race found by hand is a race that comes back.
    # The module and its shared package are separate jobs, each with the full
    # fifteen-minute ceiling. The go-test deadline is per test binary and the
    # two are an order of magnitude apart under the detector — 60s against 224s
    # on a developer machine, and CI's cores are slower still — so a single job
    # sized for both would either starve one or overrun the ceiling. The `sim`
    # job splits its suites for the same reason.
    name: race (simulator-${{ matrix.cloud }} ${{ matrix.pkg }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, gcp, azure]
        # A dimension rather than two include entries: an include object is
        # merged into the combinations that already exist, so two of them both
        # setting the same key would collapse to one job per cloud instead of
        # two. The include below only attaches the package path to a dimension
        # value that already exists, which is what include is for.
        pkg: [module, shared]
        include:
          - { pkg: module, pkgs: '.' }
          - { pkg: shared, pkgs: './shared' }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      # The detector needs cgo, so the test binary is built differently from
      # every other job here and gets its own compile budget.
      - name: Pre-build the race test binary
        # The Google Cloud and Azure simulators grew real database data
        # planes, and a cold-cache race build of either now overruns the
        # four-minute budget this step held; the step exists to separate a
        # slow build from a hung test, which eight minutes still does.
        run: |
          bash scripts/ci-go-mod-download.sh simulator-${{ matrix.cloud }}
          cd simulator-${{ matrix.cloud }}
          CGO_ENABLED=1 go test -tags noui -race -count=1 -c -o /dev/null ${{ matrix.pkgs }}
        timeout-minutes: 8
      - name: Run unit tests under the race detector
        run: |
          cd simulator-${{ matrix.cloud }}
          make race-test RACE_TEST_TIMEOUT=10m30s RACE_TEST_PKGS='${{ matrix.pkgs }}'
        timeout-minutes: 11

  simulators-quality:
    name: simulators (dead code + copy-paste)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.3'
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.49.0
      - name: Install dupl
        run: go install github.com/mibk/dupl@v1.1.0
      - name: Install UI deps
        run: cd ui && bun install --frozen-lockfile
      - name: simulators deadcode
        run: bash scripts/simulators-deadcode.sh
      - name: simulators dupl (Go ≥200 tokens)
        run: bash scripts/simulators-dupl.sh
      - name: simulators knip (dead TS exports)
        run: bash scripts/simulators-knip.sh
      - name: simulators jscpd (UI ≥200 tokens)
        run: bash scripts/simulators-jscpd.sh

  build-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATHS }}
      - name: Check simulator SDK/CLI/Terraform coverage matrix
        run: bash scripts/check-simulator-coverage-matrix.sh
        timeout-minutes: 5
      - name: Check generated simulator surface tables
