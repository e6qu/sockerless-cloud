# Release automation. release-please watches main for Conventional Commits
# (feat:/fix:/feat!: …), maintains a release pull request with the version
# bump and CHANGELOG.md, and — when that PR merges — creates exactly ONE tag
# per release (vX.Y.Z, no per-module tags, no floating/latest tags) plus the
# GitHub Release. The release.yml workflow then attaches binaries, console
# bundles, and the version-tagged multi-architecture container images to it.
name: release-please

on:
  push:
    branches: [main]
  # A release run that fails transiently — the GitHub API answering 503 during
  # an incident is what prompted this — cannot otherwise be retried: the failed
  # run is not retryable, and the workflow has no trigger but a push, so the
  # release waits for an unrelated merge. Dispatch reruns it against main
  # without one; release-please recomputes the release from commit history, so
  # running it again is safe at any time.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # GitHub suppresses events created with the default GITHUB_TOKEN, so the
  # published release cannot trigger release.yml on its own — call it.
  release-artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
