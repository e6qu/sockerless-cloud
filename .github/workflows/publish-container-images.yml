# Build and publish the simulator container images. Currently pushes to
# ghcr.io/e6qu/<image>; the workflow can later be extended to publish
# to other registries (Docker Hub, GAR, ACR) by adding matrix entries
# or per-registry login steps.
#
# Every main commit publishes exactly one immutable short-SHA manifest and its
# two native architecture images. No mutable branch or latest tags are emitted.
#
# Multi-arch shape: each (image, arch) pair builds + pushes its own
# digest on a NATIVE runner (linux/arm64 → ubuntu-24.04-arm,
# linux/amd64 → ubuntu-latest). A trailing manifest-merge job
# composes both digests into a single multi-arch manifest list. This
# avoids QEMU emulation entirely — every build runs on its target
# CPU architecture.
name: Publish container images

on:
  push:
    branches: [main]
  # A commit can also be published by hand. Cancelled publishes left six main
  # commits with no image at all — `36a81145`, `b52cc80e`, `c06550c5`,
  # `b9d651f1`, `b01a8e29`, `418e0c84` — and a consumer pinning any of them
  # meets a bare 404 in the registry. The concurrency key below stops that
  # happening again, but it cannot produce the images that were never built,
  # and no push event can be replayed for a commit already in main's history.
  # Naming the commit here builds exactly what that commit would have built.
  workflow_dispatch:
    inputs:
      commit:
        description: >-
          Full commit SHA to publish. Defaults to the tip of the ref this run
          was dispatched from.
        required: false
        type: string

# Keyed by commit, never by branch. This workflow's product is the immutable
# short-SHA image for one commit, and no later commit can produce it: grouping
# every main push under `main` and cancelling in progress meant each merge
# killed its predecessor's build, leaving that commit with no image at all and
# a pull by commit answering 404. A per-commit group has exactly one member, so
# nothing here is ever superseded — publishes for adjacent merges run side by
# side, each pushing its own tags.
#
# Registry retention is a separate workflow, triggered by this one's completion.
# That separation keeps two prunes from racing each other; it does NOT keep a
# prune away from a publish, because the publish that triggers it is rarely the
# only one running. A publish between its two per-arch pushes looks like an
# obsolete remnant to the selector, and was deleted as one — so the pruner
# spares anything younger than its grace window (scripts/prune-ghcr-images.sh).
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ inputs.commit || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    timeout-minutes: 5
    name: Release coordinates
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.revision.outputs.short_sha }}
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - id: revision
        env:
          REVISION: ${{ inputs.commit || github.sha }}
        run: |
          if [ ${#REVISION} -ne 40 ]; then
            echo "publish needs a full 40-character commit SHA, got: $REVISION" >&2
            exit 1
          fi
          echo "commit=$REVISION" >> "$GITHUB_OUTPUT"
          echo "short_sha=${REVISION:0:12}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: sockerless-simulator-aws, dockerfile: simulator-aws/Dockerfile, context: . }
          - { name: sockerless-simulator-gcp, dockerfile: simulator-gcp/Dockerfile, context: . }
          - { name: sockerless-simulator-azure, dockerfile: simulator-azure/Dockerfile, context: . }
        arch:
          - { platform: linux/amd64, runner: ubuntu-latest, suffix: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, suffix: arm64 }
    name: ${{ matrix.image.name }} (${{ matrix.arch.suffix }})
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (per-arch, by digest)
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.arch.platform }}
          push: true
          provenance: false
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
          tags: ${{ env.REGISTRY }}/e6qu/${{ matrix.image.name }}:${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch.suffix }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.suffix }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.suffix }},mode=max

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - sockerless-simulator-aws
          - sockerless-simulator-gcp
          - sockerless-simulator-azure
    name: ${{ matrix.image }} manifest
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose multi-arch manifest list
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ env.REGISTRY }}/e6qu/${{ matrix.image }}:${{ needs.prepare.outputs.short_sha }}"
          AMD64_REF="$TAG-amd64"
          ARM64_REF="$TAG-arm64"
          echo "▸ assembling $TAG from $AMD64_REF + $ARM64_REF"
          docker buildx imagetools create \
            --tag "$TAG" \
            "$AMD64_REF" \
            "$ARM64_REF"

          for REF in "$AMD64_REF" "$ARM64_REF"; do
            MEDIA_TYPE=$(docker buildx imagetools inspect \
              --format '{{.Manifest.MediaType}}' "$REF")
            test "$MEDIA_TYPE" = "application/vnd.oci.image.manifest.v1+json"
          done

          MEDIA_TYPE=$(docker buildx imagetools inspect \
            --format '{{.Manifest.MediaType}}' "$TAG")
          test "$MEDIA_TYPE" = "application/vnd.oci.image.index.v1+json"
          PLATFORMS=$(docker buildx imagetools inspect \
            --format '{{range .Manifest.Manifests}}{{printf "%s/%s\n" .Platform.OS .Platform.Architecture}}{{end}}' \
            "$TAG" | sort)
          test "$PLATFORMS" = "$(printf 'linux/amd64\nlinux/arm64')"

  # Retention lives in prune-container-images.yml, which this workflow's
  # completion triggers. Publishing and pruning need opposite concurrency
  # settings; that workflow's header records why.
